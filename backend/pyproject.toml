[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investigation-ai-backend"
version = "0.1.0"
description = "Product-facing FastAPI backend for InvestigationAI. Serves the app UI and delegates all LLM/search/critique work to the InvestigationAi_DS service over HTTP."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "bcrypt>=4.1.0,<5.0.0",
    "python-docx>=1.2.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["unittests"]
