services:

  selenium-hub:
    image: selenium/hub:4.41.0
    platform: linux/amd64
    container_name: qa-selenium-hub

    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"

  chrome:
    image: selenium/node-chrome:4.41.0
    platform: linux/amd64
    container_name: qa-selenium-chrome

    shm_size: 2gb

    depends_on:
      - selenium-hub

    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

  firefox:
    image: selenium/node-firefox:4.41.0
    platform: linux/amd64
    container_name: qa-selenium-firefox

    shm_size: 2gb

    depends_on:
      - selenium-hub

    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

  edge:
    image: selenium/node-edge:4.41.0
    platform: linux/amd64
    container_name: qa-selenium-edge

    shm_size: 2gb

    depends_on:
      - selenium-hub

    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
