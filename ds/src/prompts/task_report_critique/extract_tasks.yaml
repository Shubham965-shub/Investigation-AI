active: v2
versions:
  v1:
    description: Initial version — extract structured tasks from raw investigation task report text
    created_at: '2026-06-12T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance expert. Extract all investigation tasks from the raw text of an investigation task report.

      RAW PARAGRAPHS (with style hints):
      {raw_paragraphs}

      RAW TABLE DATA:
      {raw_tables}

      Rules:
      1. Identify all tasks (Task 1, Task 2, ... Task N). Task titles are prefixed with "Task N:" or "<Task N:".
      2. For each task, extract every investigation sub-point and its inference/conclusion.
      3. Extract the problem_statement (the event description at the start).
      4. Extract the objective of the investigation.
      5. Keep the original text — do not paraphrase or summarise findings.
      6. If a table belongs to a task (e.g., an equipment cleaning table under Task 3), include its content in that task's investigation_points as a sub_task entry.
      7. overall_inference for each task is the final "Inference:" paragraph for that task.
      8. section_labels: list every table header text or section heading that appears inside this task's section (e.g. "Staging of raw materials in Warehouse", "Gowning for the Raw material and excipient dispensing"). These are used to map images to tasks. Copy the exact header text as it appears in the raw table data.

      Return ONLY valid JSON matching the schema. No markdown fences.
  v2:
    description: v2 — flat extraction matching template structure; handles Deviation/OOS/OOT/Market Complaint formats
    created_at: '2026-06-24T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance expert. Extract all investigation tasks from the raw text of an investigation task report.

      DOCUMENT TEMPLATE REFERENCE (canonical structure every report follows):
      ─────────────────────────────────────────────
      Problem statement: <narrative description of the event>

      Investigation tasks
      <Title of the task>
        Objective: <what this task aims to determine>
        Findings: <full factual findings, including data from tables>
      Inference: <concluding inference for this task>
      ─────────────────────────────────────────────

      RAW PARAGRAPHS (with style hints):
      {raw_paragraphs}

      RAW TABLE DATA:
      {raw_tables}

      Extraction rules:
      1. Extract problem_statement: the full narrative under "Problem statement:" at the top of the document.
      2. Extract objective: the investigation-level framing paragraph under "Investigation tasks:" that describes the overall scope or approach. Leave blank if absent.
      3. A TASK is any section — numbered or unnumbered, at any heading level — that contains all four of these elements:
           - a title (a heading, bold label, or section name)
           - an Objective (text following "Objective:")
           - findings (body text or table data between Objective and Inference)
           - an Inference (text following "Inference:")
         Do NOT use numbering to decide what counts as a task. If a section has all four elements, it is a task.
      4. For each identified task, extract:
         - title: the heading or label text. Strip any leading number prefix (e.g. "2.1 Evaluation of Materials" → "Evaluation of Materials"). Preserve exact wording.
         - objective: all text after "Objective:" up to the findings body. Do not paraphrase.
         - findings: all body text and inline table content between the objective and "Inference:". Include table data as readable rows or structured prose. Do not paraphrase or summarise.
         - inference: all text after "Inference:" up to the next task heading. Do not paraphrase.
         - section_labels: exact header text of every table or bold sub-heading within this task's section. Used to map photos to tasks — copy text exactly as it appears in the raw table data.
      5. Assign task_number sequentially starting at 1, in document order.
      6. Keep original text throughout — do not paraphrase, summarise, or shorten any field.
      7. Do not extract "Identified Root Cause", "Causal factor", or "CAPA Proposal" sections as tasks.

      Return ONLY valid JSON matching the schema. No markdown fences.
