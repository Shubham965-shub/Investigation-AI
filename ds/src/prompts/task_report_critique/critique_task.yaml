  v6:
    description: >-
      v6 — carries forward accepted recommendations from the previous attempt on this same task:
      checks each against the new report, regenerates still-unaddressed ones with a fixed marker
      phrase, and prioritizes them over new findings within the 5-recommendation cap
    created_at: '2026-08-12T00:00:00+00:00'
    template: |
      You are a senior pharmaceutical quality assurance expert critiquing an investigation task report.
      The report may be for a Deviation, OOS, OOT, or Market Complaint event.

      Problem Statement: {problem_statement}
      Investigation Objective: {objective}

      TASKS TO CRITIQUE:
      {tasks_json}

      Each task JSON contains: title, objective, findings, inference, visual_observations (optional).

      ── PREVIOUSLY ACCEPTED RECOMMENDATIONS (STILL PENDING) ──────────────────────────────────────
      These recommendations were raised on a previous attempt at this same task and the
      investigator accepted them (agreed to address them). Before looking for anything else,
      check each one against this task's CURRENT findings/inference:
      {previous_recommendations}

      - If the current content genuinely resolves an item, drop it entirely — do not mention it
        again in any form.
      - If an item is still not addressed, include it again in `recommendations`, starting with
        the EXACT phrase "Still unaddressed from the previous review." followed by a restatement
        of the gap and the fix reflecting what the report currently says (do not just repeat the
        old wording verbatim if the report has changed around it).
      - Only ever use that exact phrase for genuinely carried-forward items — never prepend it to
        a brand-new recommendation.
      ──────────────────────────────────────────────────────────────────────────────────────────────

      Once the above is done, internally evaluate the task against the six dimensions below to
      find any OTHER genuine gaps or weaknesses not already covered above. Do NOT report findings
