         • No absent or incomplete datasets that should have been collected.
         • No unstated or weak assumptions.
         • Other plausible explanations were considered and ruled out.
         • Limitations and uncertainties are explicitly discussed.

      If visual_observations exist and reveal a gap or contradict a written finding, weave that into
      the relevant recommendation naturally.

      ── HOW TO WRITE EACH NEW RECOMMENDATION ──

      - Use simple, everyday language. Avoid regulatory terminology and the names or numbers of the
        checks above — write as if you're pointing something out to the investigator directly, not
        filing a compliance finding.
      - Use abbreviations and terms exactly as the report uses them. Do NOT expand, define, or guess
        what an abbreviation stands for — if the report doesn't spell it out, neither should you.
      - Phrase every item as exactly two direct sentences, not a question and not a hyphenated clause:
        the first sentence states the specific gap observed, the second sentence states the fix as an
        instruction. Do NOT join the two with a hyphen or dash. For example: "The inference doesn't
        explain how the measurements led to this conclusion. Add a sentence connecting the two." or
        "This task references a photo that isn't included. Attach the supporting evidence." Never
        phrase a recommendation as "why don't you...", "could you...", "have you considered...", or
        any other question form.
      - Cover exactly ONE issue per recommendation. If a task has several distinct gaps, write a
        separate recommendation for each rather than bundling them into one long sentence — do not
        chain unrelated asks together with "and"/"also".
      - Every new recommendation must be exactly two sentences: the gap, then the fix. No more, no
        fewer. (Carried-forward unaddressed items follow the marker-phrase format above instead.)
      - Only create a new recommendation for a genuine gap not already covered by a carried-forward
        item above.

      ── CAP: AT MOST 5 RECOMMENDATIONS PER TASK ──

      Still-unaddressed carried-forward recommendations always take priority. Specifically:
      - If there are 5 or more still-unaddressed carried-forward items, return only those (the 5
        most significant ones if there are more than 5) and no new recommendations at all.
      - Otherwise, keep every still-unaddressed carried-forward item, then fill the remaining slots
        up to 5 with the most significant new genuine gaps found in this attempt.
      List carried-forward items first, then new ones, each group ordered most to least significant.

      ── OUTPUT ──

      For each task, return:
      - recommendations: a flat list of at most 5 items as described above (empty list if there are
        no still-unaddressed carried-forward items and no genuine new gaps) — do not group, number,
        or tag items by dimension name.
      - strengths: 1-2 sentences, in simple language, on what the investigator did well in this task.
        Be genuine and specific, not generic praise. Keep positive observations out of
        `recommendations` entirely — every entry there must point to a gap or improvement.

      overall_report_summary: 2–3 sentences on the most significant collective gaps across the report.

      Return ONLY valid JSON matching the schema. No markdown fences.
