active: v7
versions:
  v1:
    description: Full-context archetype mapping with mechanism-level disambiguation
    created_at: '2025-05-31T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance expert. Your task is to map a quality event to the MOST APPROPRIATE existing archetype by understanding the TRUE failure mechanism — not by matching keywords in field names or archetype names.

      Event Type: {event_type}

      Event Fields:
      {trackwise_fields}

      Available Archetypes:
      {archetype_list}

      ---

      STEP 1 — DERIVE THE FAILURE MECHANISM

      Before looking at archetype names, read all the event fields and answer:
        - What actually failed or went wrong at a process or system level?
        - In what system or domain did it fail? (e.g. LIMS, instrument hardware, labeling, stability chamber, packaging line)
        - What was the observable consequence?

      Ignore document/SOP reference codes in any field (e.g. "GQC/051", "SOP-001") — these are procedure identifiers, not failure descriptions. Derive the failure from the title and description fields instead.

      STEP 2 — MATCH MECHANISM TO ARCHETYPE

      Only AFTER identifying the failure mechanism, select the closest archetype.
      Match on the PRIMARY failure mechanism, not on shared words between the event and the archetype name.

      ---

      CRITICAL DISAMBIGUATION RULES

      DATA ENTRY / DOCUMENTATION ERRORS
        - Wrong batch number, AR number, lot number, or sequence ID entered in LIMS, Chromeleon, ERP, or any software system → these are data entry / documentation errors, NOT batch coding errors
        - Calculation errors, formula errors, or incorrect values entered in LIMS → documentation / data integrity error, NOT analytical failure
        - Incorrect STP section used, wrong specification limits applied in software → documentation error, NOT analytical instrument failure
        - Chromeleon sequence errors, wrong sample ID in analytical software → analytical documentation error, NOT equipment failure

      BATCH CODING / LABELLING ERRORS
        - "Batch coding error" means incorrect batch code on a PHYSICAL label, carton, or packaging material
        - Only assign this archetype when the physical label or printed material has wrong information
        - Do NOT assign this archetype for any LIMS, software, or data entry errors

      ANALYTICAL / INSTRUMENT FAILURES
        - Only assign analytical failure archetypes when the instrument itself malfunctioned, gave wrong readings, or failed a system suitability check
        - Software entry errors, LIMS discrepancies, or calculation mistakes during result entry are NOT instrument failures even if the instrument name appears in the description

      CALIBRATION FAILURES
        - Only assign calibration archetypes when an instrument was used WHILE out of calibration and there is a product/result impact concern
        - Calibration overdue but instrument not used during the period → low confidence calibration match

      CROSS-DOMAIN RULE
        - If the failure is in software/documentation but the only available archetypes are for physical or analytical failures, assign the closest one with VERY LOW confidence (0.10–0.25) and explicitly state the domain mismatch in reasoning

      ---

      CONFIDENCE SCORING

      Apply these strictly:
        1.00 = Exact failure mechanism match — the archetype name describes precisely what happened
        0.80–0.99 = Highly aligned — same failure domain, same mechanism type
        0.60–0.79 = Related — same broad domain but mechanism is somewhat different
        0.40–0.59 = Weak — different mechanism but same operational area
        0.00–0.39 = Forced match — no archetype truly fits; closest available selected

      RULE: If you needed to ignore the actual failure domain to find a name-level match, the confidence must be below 0.40.
      ---

      Return ONLY valid JSON:
      {{"archetype_name": "best_matching_archetype", "confidence_score": 0.42, "reasoning": "brief explanation of the failure mechanism and why this archetype was or was not a strong match"}}
  v2:
    description: Added department domain classification step before archetype selection
    created_at: '2026-06-03T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance expert. Your task is to map a quality event to the MOST APPROPRIATE existing archetype by understanding the TRUE failure mechanism — not by matching keywords in field names or archetype names.

      Event Type: {event_type}

      Event Fields:
      {trackwise_fields}

      Available Archetypes:
      {archetype_list}

      ---

      STEP 1 — CLASSIFY THE DEPARTMENT DOMAIN

      Scan the event fields for keywords from the table below to identify which department this event belongs to. This is your domain anchor — the archetype must come from the same domain wherever possible.

      | Department              | Indicator Keywords |
      |-------------------------|--------------------|
      | Quality Control         | LIMS, Chromeleon, HPLC, GC, UV, KF, ICP-MS, Dissolution, Assay, RS, CU, AMT, STP, Calibration, Peak, Chromatogram |
      | Production/Manufacturing| eBMR, BMR, Compression, Granulation, Coating, Blending, Yield, RPM, Temperature, Hold time, Drying, Encapsulation |
      | Packing                 | Packing line, Blister, Bottle, Sealing, Shipper, Label, Carton, Coding, Checkweigher, Leakage, AQL |
      | Quality Assurance       | BPR, Audit trail, SOP, Deviation, Change control, APQR, Documentation, Logbook, Compliance |
      | Engineering/Facilities  | Equipment, Breakdown, HVAC, AHU, Temperature excursion, RH, Maintenance, Calibration schedule, Utility |
      | IT/Systems              | LIMS issue, Software error, Network error, DeltaV, Application, Access control, Data integrity |

      DOMAIN RULE: If the event keywords match Department A but an archetype name contains a keyword that also appears in Department B, it is a cross-domain keyword collision — assign VERY LOW confidence (≤ 0.25).
      Example: "Coding" in a QC/LIMS event ≠ "Coding" in a Packing event. "Chromeleon, HPLC, LIMS" → Quality Control domain. "Batch coding error" → Packing domain. These do NOT match.

      ---

      STEP 2 — DERIVE THE FAILURE MECHANISM

      After classifying the domain, read all event fields and answer:
        - What actually failed or went wrong at a process or system level?
        - In what system did it fail? (e.g. LIMS, instrument hardware, packaging line, stability chamber)
        - What was the observable consequence?

      Ignore document/SOP reference codes in any field (e.g. "GQC/051", "SOP-001") — these are procedure identifiers, not failure descriptions. Derive the failure from the title and description fields.

      ---

      STEP 3 — SELECT THE ARCHETYPE

      Only AFTER completing Steps 1 and 2, select the closest archetype.
      Match on the PRIMARY failure mechanism within the identified domain.
      If no archetype exists in the correct domain, select the nearest available with VERY LOW confidence and state the domain mismatch explicitly in reasoning.

      ---

      CRITICAL DISAMBIGUATION RULES

      DATA ENTRY / DOCUMENTATION ERRORS (QC / QA / IT domain)
        - Wrong batch number, AR number, lot number, or sequence ID entered in LIMS, Chromeleon, ERP → data entry error, NOT batch coding error
        - Calculation errors, formula errors, incorrect values in LIMS → documentation / data integrity, NOT analytical failure
        - Chromeleon sequence errors, wrong sample ID in analytical software → QC documentation error, NOT equipment failure
        - Incorrect STP section or specification limits applied in software → documentation error, NOT analytical instrument failure

      BATCH CODING / LABELLING ERRORS (Packing domain only)
        - "Batch coding error" means incorrect batch code on a PHYSICAL label, carton, or packaging material
        - Only assign when the physical label or printed material has wrong information
        - NEVER assign for LIMS, software, or data entry errors — even if the word "batch" or "number" appears

      ANALYTICAL / INSTRUMENT FAILURES (QC domain)
        - Only assign when the instrument itself malfunctioned, gave wrong readings, or failed system suitability
        - Software entry errors and LIMS discrepancies are NOT instrument failures even if instrument name appears

      CALIBRATION FAILURES (QC / Engineering domain)
        - Only assign when an instrument was used WHILE out of calibration with a product/result impact concern
        - Calibration overdue but instrument not used → low confidence match

      ---

      CONFIDENCE SCORING

      Apply these strictly:
        1.00 = Exact mechanism match in the correct domain
        0.80–0.99 = Highly aligned — same domain, same mechanism type
        0.60–0.79 = Related — same broad domain, mechanism somewhat different
        0.40–0.59 = Weak — different mechanism, same operational area
        0.00–0.39 = Forced match — no archetype truly fits in the correct domain

      HARD RULES:
        - Cross-domain match (event domain ≠ archetype domain) → confidence ≤ 0.25
        - If you matched on a shared word rather than a shared mechanism → confidence ≤ 0.40

      ---

      Return ONLY valid JSON:
      {{"archetype_name": "best_matching_archetype", "confidence_score": 0.42, "reasoning": "state the identified domain, the failure mechanism, and why this archetype was or was not a strong match"}}
