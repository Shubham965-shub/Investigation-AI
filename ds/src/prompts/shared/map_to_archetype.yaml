  v4:
    description: Adding the discussed buisness-specific rules
    created_at: '2026-06-03T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance expert. Your task is to map a quality event to the MOST APPROPRIATE existing archetype by understanding the TRUE failure mechanism — not by matching keywords in field names, department names, or archetype names.

      Event Type: {event_type}

      Event Fields:
      {trackwise_fields}

      Available Archetypes:
      {archetype_list}

      ---

      STEP 1 — IDENTIFY THE OPERATIONAL CONTEXT

      Determine the operational context of the event.

      Possible contexts include:

      | Context           | Typical Indicators                                                                                   |
      | ----------------- | ---------------------------------------------------------------------------------------------------- |
      | Quality Control   | LIMS, Chromeleon, HPLC, GC, Dissolution, Assay, Related Substances, Chromatogram, Sample Preparation |
      | Manufacturing     | Compression, Granulation, Coating, Blending, Yield, Drying, Encapsulation                            |
      | Packaging         | Blister, Bottle, Carton, Label, Coding, Checkweigher, Packaging Line                                 |
      | Quality Assurance | Documentation, SOP, Change Control, Deviation, Compliance                                            |
      | Engineering       | Equipment, HVAC, Utility, Breakdown, Maintenance, Calibration                                        |
      | IT / Systems      | Software, Network, Application, Database, Access Control, System Configuration                       |

      IMPORTANT:

      Operational context is a DISAMBIGUATION TOOL ONLY.

      Do NOT prefer an archetype simply because it belongs to the same department.

      The purpose of context classification is to:

      * interpret terminology correctly
      * avoid keyword collisions
      * understand where the failure occurred

      The purpose is NOT to drive confidence scoring.

      Example:

      A QC calculation error may be much closer to a QA documentation archetype than to a QC analytical failure archetype.

      ---

      STEP 2 — IDENTIFY THE FAILURE MECHANISM

      Read all available fields and determine:

      1. What actually failed?
      2. What object, KPI, attribute, or process was affected?
      3. How did the failure manifest?

      Focus on the underlying mechanism, not the symptom.

      Examples:

      Calculation discrepancy:

      * incorrect calculation
      * formula mismatch
      * incorrect result generation
      * computation error

      Data integrity issue:

      * incorrect data entry
      * wrong sample assignment
      * metadata mismatch
      * incorrect identifier

      Analytical failure:

      * unknown peak
      * system suitability failure
      * chromatographic issue
      * assay failure
      * dissolution failure

      Equipment failure:

      * breakdown
      * malfunction
      * hardware fault
      * process interruption

      Packaging failure:

      * coding defect
      * labeling defect
      * sealing defect
      * packaging mix-up

      Manufacturing failure:

      * yield deviation
      * hardness variation
      * thickness deviation
      * process parameter excursion

      Ignore:

      * SOP numbers
      * STP numbers
      * Procedure codes
      * Department codes
      * Document references

      These are identifiers, not failure mechanisms.

      ---

      STEP 3 — APPLY BUSINESS RULES

      Review any business-specific mapping rules.

      If a business rule explicitly applies:

      * select the required archetype
      * explain why the rule was applied
      * adjust confidence according to the rule

      Do not force a business rule when the event clearly represents a different failure mechanism.

      ---

      STEP 4 — MATCH TO ARCHETYPE

      Evaluate each archetype using the following priority order:

      Priority 1 (Highest Weight):
      FAILURE MECHANISM

      Examples:

      * calculation error
      * data entry error
      * software processing error
      * instrument malfunction
      * packaging defect
      * calibration failure

      Priority 2:
      FAILURE OBJECT / KPI

      Examples:

      * related substances
      * assay
      * dissolution
      * unknown peak
      * hardness
      * yield
      * batch assignment
      * coding

      Priority 3:
      PROCESS CONTEXT

      Examples:

      * GC
      * HPLC
      * LIMS
      * Chromeleon
      * Packaging Line
      * Compression Process

      Priority 4 (Lowest Weight):
      OPERATIONAL CONTEXT

      Department alignment should only be used as a tie-breaker.

      A same-domain archetype with a different failure mechanism is usually a worse match than a cross-domain archetype with a similar mechanism.

      ---

      CRITICAL DISAMBIGUATION RULES

      DATA ENTRY / DOCUMENTATION FAILURES

      Examples:

      * Wrong batch number entered
      * Wrong sample identifier entered
      * Incorrect LIMS entry
      * Incorrect sequence setup
      * Formula mismatch
      * Calculation discrepancy

      These are documentation, data integrity, or system-processing failures.

      They are NOT:

      * analytical failures
      * instrument failures
      * packaging coding failures

      ---

      ANALYTICAL FAILURES

      Only assign when:

      * analytical performance failed
      * chromatographic behavior failed
      * unknown peak observed
      * assay failed
      * dissolution failed
      * system suitability failed

      Do NOT assign analytical failure archetypes for:

      * data entry issues
      * calculation discrepancies
      * software configuration errors
      * metadata errors

      ---

      INSTRUMENT FAILURES

      Only assign when:

      * hardware malfunction occurred
      * instrument produced incorrect readings
      * instrument operation failed

      Do NOT assign for:

      * LIMS errors
      * Chromeleon sequence setup errors
      * calculation discrepancies
      * documentation mistakes

      ---

      PACKAGING CODING FAILURES

      Only assign when:

      * physical packaging material contains incorrect coding
      * labels, cartons, or printed materials are wrong

      Do NOT assign for:

      * batch number entered incorrectly in software
      * sample identifier errors
      * LIMS entry mistakes

      ---

      CONFIDENCE SCORING

      1.00
      Exact failure mechanism match.
      Same failure object and same operational context.

      0.80–0.99
      Strong mechanism match.
      Same failure category and highly similar affected KPI.

      0.60–0.79
      Related mechanism.
      Similar operational problem but different KPI or context.

      0.40–0.59
      Weak relationship.
      Shares process area or outcome but mechanism differs.

      0.20–0.39
      Poor relationship.
      Only broadly operationally related.

      0.00–0.19
      Fallback match only.
      No archetype truly represents the failure.

      IMPORTANT:

      Confidence is primarily determined by mechanism similarity.

      Mechanism similarity > KPI similarity > process similarity > domain similarity.

      A shared department should never justify a high confidence score.

      A shared keyword should never justify a high confidence score.

      If the selected archetype shares terminology but not mechanism, confidence must be ≤ 0.40.

      ---

      Return ONLY valid JSON:

      {{
      "archetype_name": "best_matching_archetype",
      "confidence_score": 0.42,
      "reasoning": "Identify the operational context, explain the true failure mechanism, explain the affected KPI, explain why the archetype is or is not a strong mechanism match, and mention any business rule applied."
      }}
  v5:
    description: Mechanism-to-definition matching; domain is tie-breaker only; same-domain
      mismatch penalised
    created_at: '2026-06-04T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance expert. Map a quality event to the most appropriate archetype by comparing the TRUE failure mechanism against each archetype's definition — not by matching department names, domain labels, or keywords.

      Event Type: {event_type}

      Event Fields:
      {tw_fields_str}

      Available Archetypes (name: definition):
      {archetype_list}

      ---

      STEP 1 — IDENTIFY THE OPERATIONAL CONTEXT (disambiguation only)

      Classify the event's operational context to interpret terminology correctly and avoid keyword collisions. This is NOT a scoring factor.

      | Context           | Typical Indicators                                                                                    |
      | ----------------- | ----------------------------------------------------------------------------------------------------- |
      | Quality Control   | LIMS, Chromeleon, HPLC, GC, Dissolution, Assay, Related Substances, Chromatogram, Sample Preparation  |
      | Manufacturing     | Compression, Granulation, Coating, Blending, Yield, Drying, Encapsulation                             |
      | Packaging         | Blister, Bottle, Carton, Label, Coding, Checkweigher, Packaging Line                                  |
      | Quality Assurance | Documentation, SOP, Change Control, Deviation, Compliance                                             |
      | Engineering       | Equipment, HVAC, Utility, Breakdown, Maintenance, Calibration                                         |
      | IT / Systems      | Software, Network, Application, Database, Access Control, System Configuration                        |

      IMPORTANT: Context is used ONLY to resolve ambiguous terms. A same-domain archetype with a mismatched definition is a WORSE match than a cross-domain archetype with a matching definition.

      ---

      STEP 2 — IDENTIFY THE FAILURE MECHANISM

      From the event fields, determine:
        1. What actually failed or went wrong?
        2. What object, KPI, or process attribute was affected?
        3. How did the failure manifest?

      Focus on the underlying mechanism, not the symptom. Ignore SOP/STP reference codes — they are identifiers, not failure descriptions.

      ---

      STEP 3 — MATCH MECHANISM TO ARCHETYPE DEFINITION

      For every candidate archetype, compare your identified failure mechanism against the archetype's definition (provided in the list above).

      SELECTION RULE: The archetype whose definition most closely describes the identified failure mechanism wins — regardless of domain.

      PENALTY RULES (apply strictly):
        - If the event mechanism does not align with the archetype definition → confidence ≤ 0.40, even if they share domain or keywords
        - If the definition describes a fundamentally different failure type → confidence ≤ 0.20
        - Sharing the same domain (e.g. both in QC) does NOT justify a high confidence if mechanisms differ
        - A keyword match on the archetype NAME without a mechanism match in the DEFINITION → confidence ≤ 0.40

      ---

      STEP 4 — APPLY BUSINESS RULES

      Check these specific disambiguation rules:

      DATA ENTRY / DOCUMENTATION FAILURES
        - Wrong batch number, sample ID, or AR number entered in LIMS, Chromeleon, or ERP → documentation/data integrity failure, NOT analytical failure, NOT batch coding error
        - Calculation errors, formula mismatch, incorrect LIMS entry → documentation failure

      BATCH CODING / LABELLING ERRORS (Packaging domain only)
        - Only assign when a PHYSICAL label, carton, or printed material has incorrect information
        - NEVER assign for LIMS or software entry errors, even if "batch number" appears in the description

      ANALYTICAL FAILURES (QC domain)
        - Only assign when analytical performance failed: unknown peak, assay OOS, dissolution failure, system suitability failure
        - NOT for data entry errors or calculation discrepancies

      INSTRUMENT FAILURES
        - Only assign when hardware malfunctioned or produced incorrect readings
        - NOT for LIMS errors, sequence setup mistakes, or calculation discrepancies

      ---

      CONFIDENCE SCORING

      Driven entirely by how well the failure mechanism matches the archetype definition:

        1.00 = Archetype definition precisely describes the identified failure mechanism
        0.80–0.99 = Strong match — same failure category, similar affected KPI
        0.60–0.79 = Related — similar mechanism but different KPI or context
        0.40–0.59 = Weak — shares some process context but mechanisms differ
        0.20–0.39 = Poor — only broadly related; definition does not fit the failure
        0.00–0.19 = Fallback only — no archetype truly represents this failure

      HARD RULES:
        - Mechanism does not match the archetype definition → confidence ≤ 0.40
        - Domain differs AND mechanism does not match definition → confidence ≤ 0.20
        - Shared department or keyword alone NEVER justifies confidence > 0.40

      ---

      Return ONLY valid JSON:

      {{
      "archetype_name": "best_matching_archetype",
      "confidence_score": 0.42,
      "reasoning": "State the operational context, the identified failure mechanism, which archetype definition best matches it and why, what penalty rules if any were applied, and whether any business rule was applied."
      }}
  v6:
    description: No changes to the prompt; this version is for testing the impact
      of the new business rules on archetype mapping outcomes.
    created_at: '2026-06-05T00:00:00+00:00'
    template: "You are a pharmaceutical quality assurance expert. Your task is to\
      \ determine if a quality event EXACTLY MATCHES one of the provided archetypes.\
      \ \n\nThis is a STRICT BINARY DECISION. Do not force a fit. It is either a precise\
      \ definitional match, or it is not. Getting this wrong results in entirely incorrect\
      \ evidence collection.\n\nEvent Type: {event_type}\n\nEvent Fields:\n{tw_fields_str}\n\
      \nAvailable Archetypes (name: definition):\n{archetype_list}\n\n---\n\nSTEP\
      \ 1 — IDENTIFY THE OPERATIONAL CONTEXT (Disambiguation)\nClassify the event's\
      \ operational context to interpret terminology correctly. \n- QC: LIMS, Chromeleon,\
      \ HPLC, GC, Dissolution, Assay\n- Mfg: Compression, Granulation, Coating, Yield\n\
      - Pkg: Blister, Bottle, Carton, Label, Coding\n- QA: Documentation, SOP, Deviation\n\
      - Eng: Equipment, HVAC, Maintenance\n- IT: Software, Network, Access\n\nSTEP\
      \ 2 — IDENTIFY THE TRUE FAILURE MECHANISM\nFrom the event fields, determine:\n\
      1. What actually failed or went wrong?\n2. What object or process attribute\
      \ was affected?\nFocus on the underlying mechanism, not the symptom or department\
      \ keywords.\n\nSTEP 3 — STRICT DEFINITION MATCHING\nCompare the identified failure\
      \ mechanism against the archetype definitions.\n- The archetype definition must\
      \ precisely and entirely describe the failure mechanism.\n- Do NOT guess. Do\
      \ NOT pick the \"closest\" one if it is not an exact logical fit.\n- A keyword\
      \ match on the archetype NAME without a mechanism match in the DEFINITION is\
      \ an automatic failure.\n\nSTEP 4 — APPLY BUSINESS RULES (Disqualification Filters)\n\
      - DATA ENTRY: Wrong batch number, AR number, or LIMS entry is a documentation/data\
      \ integrity failure, NOT an analytical or batch coding failure.\n- BATCH CODING\
      \ (Pkg): Only assign if a PHYSICAL printed material has incorrect info. NEVER\
      \ assign for software entry errors.\n- ANALYTICAL (QC): Only assign if analytical\
      \ performance failed (e.g., assay OOS). NOT for data entry or calculation errors.\n\
      - INSTRUMENT: Only assign if hardware malfunctioned. NOT for LIMS errors or\
      \ sequence setup mistakes.\n\n---\n\nBINARY CONFIDENCE SCORING\n\nYou must output\
      \ ONLY one of two possible scores. There is no middle ground.\n\n1.0 = EXACT\
      \ MATCH. The failure mechanism is perfectly described by the archetype definition.\n\
      0.0 = NO MATCH. No archetype definition perfectly describes the failure. Do\
      \ not force a fit. (If 0.0, set \"archetype_name\" to \"None\").\n\n---\n\n\
      Return ONLY valid JSON:\n\n{{\n\"archetype_name\": \"best_matching_archetype_or_None\"\
      ,\n\"confidence_score\": 1.0 or 0.0,\n\"reasoning\": \"State the identified\
      \ failure mechanism, why it EXACTLY matches the definition (or why none perfectly\
      \ fit), and confirm no business rules were violated.\"\n}}\n"
  v7:
    description: Adds an explicit verbatim-copy requirement for archetype_name. v6
      (and every prior version) let the model paraphrase the winning archetype's name
      in its own words (e.g. "OOS result found in assay by HPLC" came back as "OOS
      result found for assay in HPLC") — harmless-looking, but map_to_archetype (shared/nodes.py)
      matches archetype_name against the DB's archetype.name with an exact case-insensitive
      string comparison, so any paraphrase — even a single swapped preposition — silently
      misses and falls back to a "new archetype" with no id, which then fetches zero
      questions/evidence items even though the correct archetype and its library content
      exist (confirmed live and reproduced 3/3 times against deviation_id 506435,
      always returning a paraphrase of the correct archetype, never its literal name).
    created_at: '2026-09-08T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance expert. Your task is to determine if a quality event EXACTLY MATCHES one of the provided archetypes.

      This is a STRICT BINARY DECISION. Do not force a fit. It is either a precise definitional match, or it is not. Getting this wrong results in entirely incorrect evidence collection.

      Event Type: {event_type}

      Event Fields:
      {tw_fields_str}

      Available Archetypes (name: definition):
      {archetype_list}

      ---

      STEP 1 — IDENTIFY THE OPERATIONAL CONTEXT (Disambiguation)
      Classify the event's operational context to interpret terminology correctly.
      - QC: LIMS, Chromeleon, HPLC, GC, Dissolution, Assay
      - Mfg: Compression, Granulation, Coating, Yield
      - Pkg: Blister, Bottle, Carton, Label, Coding
      - QA: Documentation, SOP, Deviation
      - Eng: Equipment, HVAC, Maintenance
      - IT: Software, Network, Access

      STEP 2 — IDENTIFY THE TRUE FAILURE MECHANISM
      From the event fields, determine:
      1. What actually failed or went wrong?
      2. What object or process attribute was affected?
      Focus on the underlying mechanism, not the symptom or department keywords.

      STEP 3 — STRICT DEFINITION MATCHING
      Compare the identified failure mechanism against the archetype definitions.
      - The archetype definition must precisely and entirely describe the failure mechanism.
      - Do NOT guess. Do NOT pick the "closest" one if it is not an exact logical fit.
      - A keyword match on the archetype NAME without a mechanism match in the DEFINITION is an automatic failure.

      STEP 4 — APPLY BUSINESS RULES (Disqualification Filters)
      - DATA ENTRY: Wrong batch number, AR number, or LIMS entry is a documentation/data integrity failure, NOT an analytical or batch coding failure.
      - BATCH CODING (Pkg): Only assign if a PHYSICAL printed material has incorrect info. NEVER assign for software entry errors.
      - ANALYTICAL (QC): Only assign if analytical performance failed (e.g., assay OOS). NOT for data entry or calculation errors.
      - INSTRUMENT: Only assign if hardware malfunctioned. NOT for LIMS errors or sequence setup mistakes.

      STEP 5 — COPY THE WINNING NAME VERBATIM
      Once you have selected the winning archetype in Step 3, find its exact entry in the "Available Archetypes" list above and copy its name into "archetype_name" character-for-character — same spelling, same capitalization, same wording, same punctuation, same word order.
      - Do NOT paraphrase, reword, summarize, translate, or "clean up" the name in any way, even if your version reads more naturally.
      - Do NOT swap words for synonyms (e.g. "in" for "for", "by" for "via").
      - The output will be compared to the archetype list with an EXACT string match — a name that is not copied verbatim will be treated as if no archetype was found at all, discarding the correct match you just made.
      - If the decision in Step 3/4 is NO MATCH, output exactly "None" (do not invent or paraphrase a name that merely resembles one).

      ---

      BINARY CONFIDENCE SCORING

      You must output ONLY one of two possible scores. There is no middle ground.

      1.0 = EXACT MATCH. The failure mechanism is perfectly described by the archetype definition.
      0.0 = NO MATCH. No archetype definition perfectly describes the failure. Do not force a fit. (If 0.0, set "archetype_name" to "None").

      ---

      Return ONLY valid JSON:

      {{
      "archetype_name": "<copied character-for-character from the Available Archetypes list above, or None>",
      "confidence_score": 1.0 or 0.0,
      "reasoning": "State the identified failure mechanism, why it EXACTLY matches the definition (or why none perfectly fit), confirm no business rules were violated, and confirm archetype_name was copied verbatim from the list."
      }}
