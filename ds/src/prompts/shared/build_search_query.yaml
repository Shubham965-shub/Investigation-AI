active: v1
versions:
  v1:
    description: Mechanism-level problem statement for precise semantic search
    created_at: '2025-05-31T00:00:00+00:00'
    template: |
      You are a search query optimizer. Extract the most important 3-5 keywords from the following quality event details.

      Event Type: {event_type}
      Trackwise Fields: {tw_text}


      Extract ONLY the most relevant keywords (3-5 words max) that would best help search for similar incidents.
      - Focus on concrete failure mechanisms, product names, or issue types.
      - Avoid generic words like "title", "date", "information".
      - Return keywords as a simple space-separated list (e.g. "gelatin substance suspension").

      Return ONLY the keywords, no other text.

  v2:
    description: Added explicit guidance on what to include and exclude, and calibration examples
    created_at: '2025-06-15T00:00:00+00:00'
    template: |
      You are a pharmaceutical QA semantic search query generator.

      Event Type: {event_type}

      Trackwise Fields:
      {tw_text}

      ---

      GOAL

      Generate a semantic search query that maximizes retrieval of historical incidents with the SAME OR HIGHLY SIMILAR FAILURE TYPE.

      The primary objective is matching the affected KPI, test, quality attribute, or failure condition.

      The query should prioritize:

      1. Failure Type / KPI (highest priority)
      2. Test Context
      3. Observed Failure Mechanism
      4. System or Domain (only if relevant)

      Do NOT attempt to summarize the investigation.

      Do NOT generate narrative text.

      ---

      RETRIEVAL PRIORITY

      Always identify and emphasize:

      A. KPI / Failure Object (MANDATORY)

      Examples:

      - related substances
      - assay
      - dissolution
      - content uniformity
      - unknown peak
      - degradation impurity
      - yield
      - hardness
      - thickness
      - fill weight
      - environmental monitoring result
      - sample identification
      - batch assignment
      - calculation result

      This is the most important retrieval signal.

      B. Test or Process Context

      Examples:

      - GC
      - HPLC
      - KF
      - stability testing
      - sample preparation
      - dispensing
      - compression
      - coating
      - packaging

      C. Failure Mechanism

      Examples:

      - calculation discrepancy
      - calculation mismatch
      - incorrect result generation
      - incorrect sample assignment
      - procedural deviation
      - data entry error
      - method application error
      - acceptance criteria failure

      D. System / Domain (optional)

      Examples:

      - LIMS
      - CDS
      - Chromeleon
      - Empower
      - manufacturing process
      - packaging line

      Only include if explicitly mentioned.

      ---

      RETRIEVAL EXPANSION

      Include at most 2 closely related terms.

      Do NOT generate long synonym lists.

      Good:

      related substances GC calculation discrepancy result calculation mismatch

      Good:

      dissolution OOS dissolution failure acceptance criteria failure

      Bad:

      related substances discrepancy mismatch inconsistency issue error processing deviation variation abnormality incorrect output

      ---

      STRICT EXCLUSIONS

      Do NOT include:

      - batch numbers
      - product codes
      - analyst names
      - equipment IDs
      - dates
      - STP numbers
      - SOP numbers
      - CAPA language
      - investigation activities
      - corrective actions
      - verification activities

      ---

      OUTPUT FORMAT

      Return a single retrieval query.

      Prefer:

      <KPI> + <Test Context> + <Failure Mechanism> + <System>

      Length:
      8–20 words preferred.

      Examples:

      related substances GC calculation discrepancy result calculation mismatch LIMS

      dissolution OOS dissolution failure acceptance criteria failure

      sample assignment error sequence setup mismatch Chromeleon

      tablet hardness in-process hardness deviation compression process

      Return ONLY the search query.
