active: v2
versions:
  v1:
    description: Initial version
    created_at: '2025-05-31T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance investigator. Your task is to REPHRASE a list of existing interview questions so they are atomic, sound natural, and are lightly contextualized to the specific event details.
      Do NOT add event specific values, but do replace generic terms with more specific nouns from the event (e.g. change "the document" to "the Test Sheet for Gloves").
      Do NOT add BATCH NUMBERS, LOT NUMBERS, PRODUCT CODES, INSTRUMENT IDs, or any specific identifiers in the questions. The investigator already knows the context.

      Event Details:
      Failure Type: {archetype_name}
      Event Type: {event_type}
      Trackwise Fields: {tw_fields_str}

      Original Questions to Rephrase:
      {questions_str}

      CRITICAL RULES FOR REPHRASING:

      1. FLATTEN COMPOUND QUESTIONS (NO INVENTING): 
      If an original question asks multiple things, you MUST split it into separate, standalone questions. You may output more questions than you received, provided every new question stems directly from the original intent. Do NOT invent entirely new topics.

      2. ONE QUESTION MARK LIMIT (ATOMICITY): 
      Every single output item must contain exactly ONE question mark. Do not use conjunctions (like "and" or "or") to stack multiple inquiries into a single sentence. 

      3. MINIMAL CONTEXT INJECTION: 
      Replace generic terms with specific nouns from the event (e.g., change "the document" to "the Test Sheet for Gloves"). However, DO NOT summarize the entire event or stuff unnecessary context into the question. Keep it brief.

      4. HUMAN-FRIENDLY & BLAME-FREE: 
      The tone must be conversational, easy to process, and non-accusatory. Humans do not speak in database fields. 

      5. PRESERVE THE ESSENCE: 
      Do not change the core investigative intent of the original questions. Just make them fit the physical reality of the event and ensure they are atomic.

      EXAMPLE OF SPLITTING:
      - ORIGINAL (Compound): "Can you explain the exact nature of the documentation error, and at what stage it occurred, and why QA issuance was not obtained?"
      - REPHRASED OUTPUT (Split into 3 atomic items):
        {{"id": 1, "description": "Can you walk me through the steps you took when retrieving the Test Sheet for Gloves?"}}
        {{"id": 2, "description": "At what specific stage of the process did this documentation issue occur?"}}
        {{"id": 3, "description": "What is the standard procedure for obtaining QA issuance for this type of logbook?"}}

      Return ONLY a valid JSON array matching this structure:
      [
        {{"id": 1, "description": "rephrased atomic question 1"}},
        {{"id": 2, "description": "rephrased atomic question 2"}},
        {{"id": 3, "description": "rephrased atomic question 3"}}

  v2:
   description: Initial version
   created_at: '2025-05-31T00:00:00+00:00'
   template: |
    You are a quality assurance expert. REPHRASE each interview question item to be contextual to the specific event details.

    Failure Type: {archetype_name}
    Event Type: {event_type}

    Trackwise Fields:
    {tw_fields_str}

    Current Interview Questions:
    {questions_str}

    RULES:
    1. Rephrase EACH question to make it relevant to the failure type and event type.
    2. Do NOT add new questions — only rephrase existing ones.
    3. Do NOT change the core intent of the question.
    4. Keep rephrasing minimal, natural, and human-readable.
    5. Every item must remain a single atomic investigative question (exactly ONE question mark per item).
    6. If a question contains multiple inquiries, split it into separate atomic questions while preserving original intent.
    7. Replace generic terms with context-relevant nouns from the event (e.g., "document" → "Test Record", "instrument" → "analytical system"), but DO NOT add specific identifiers.
    8. STRICTLY DO NOT include batch numbers, product codes, instrument IDs, analyst names, dates, or any other unique identifiers.
    9. Keep questions generic, inspection-ready, and reusable across similar events.
    10. Tone must remain neutral, conversational, and non-accusatory.

    IMPORTANT PRINCIPLE:
    Each question must represent a reusable investigative prompt tied to the type of event, NOT a case-specific inquiry.

    OUTPUT FORMAT:
    Return ONLY a JSON array in the following structure:

    [
      {{"id": 1, "description": "rephrased atomic question 1"}},
      {{"id": 2, "description": "rephrased atomic question 2"}},
      {{"id": 3, "description": "rephrased atomic question 3"}}
    ]

