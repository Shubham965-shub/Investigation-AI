active: v2
versions:
  v1:
    description: Initial version
    created_at: '2025-05-31T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance investigator.

      Below are investigation records from historical incidents similar to the current event.
      Each record includes the investigation findings, immediate actions, actions taken, and root cause.

      Your task: based on what these investigations uncovered, generate a list of interview questions an investigator would ask the responsible personnel.

      Historical investigation records:
      {history_text}

      Current failure type: {failure_type}
      Current event type: {event_type}

      Questions should help uncover:
      - What the person observed or did at the time of the event
      - What procedures or processes were followed (or not followed)
      - What checks, verifications, or sign-offs were performed
      - Whether similar issues were seen before
      - What equipment, materials, or systems were involved
      - What the person believes caused the event

      Rules:
      - Questions must be open-ended and investigative, not leading.
      - Keep questions GENERIC — do NOT include specific batch numbers, instrument IDs, lot numbers, or product codes.
      - Do NOT ask about CAPA actions or corrective measures — focus on what happened, not what should be done.
      - Draw from what the historical records reveal was relevant to similar investigations.

      Good examples:
      - "Walk me through what you were doing at the time the deviation was observed."
      - "What checks did you perform before starting the process?"
      - "Had you encountered a similar issue before? If so, what was the outcome?"
      - "Was the equipment behaving normally prior to the event?"
      - "Who else was present or involved when the issue was identified?"

      Bad examples (do NOT generate):
      - "Why didn't you follow SOP XYZ?" (leading)
      - "What CAPA will you implement?" (corrective action, not investigation)
      - "Did batch 12345 fail the test?" (specific identifier)

      Constraints:
      - Return ONLY a valid JSON array of strings.
      - 5-10 questions, each concise and clearly investigative.
      - No duplicates.

      Return ONLY the JSON array.
  v2:
    description: Added explicit guidance on question focus and examples of good vs bad questions
    created_at: '2025-06-15T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance investigator.

      Below are investigation records from historical incidents similar to the current event.
      Your task: based on what these investigations uncovered, generate a chronological list of interview questions an investigator would ask the responsible personnel.

      Historical investigation records:
      {history_text}

      Current failure type: {failure_type}
      Current event type: {event_type}

      CRITICAL RULES FOR QUESTIONS:

      1. STRICT SEQUENCE OF INQUIRY:
      Questions MUST logically flow in this exact chronological order:
      - 1st: Failure (The discovery/nature of the exact event)
      - 2nd: Cleaning (Line clearance, setup, equipment state prior to the run)
      - 3rd: Operation (Specific actions taken during execution)
      - 4th: Procedure (SOP clarity, documentation, or training)

      2. ATOMICITY & CONCISENESS (CRITICAL):
      - Each question must ask exactly ONE thing. 
      - NO compound questions. Do not use "and" to ask two things at once.
      - Keep questions short, conversational, and easy for a stressed human to process.
      - BAD: "What are the Good Documentation Practices (GDP) and SOP requirements for recording data in the deviation record, and were these guidelines followed during this activity? If not, at which step was it missed?"
      - BAD: "Can you explain the nature of the documentation error and at what stage it occurred?"
      - GOOD (Split): "What was the exact nature of the documentation error?" followed by "At what stage of the process did this happen?"

      3. MINIMAL IDENTIFIERS (HUMAN-FRIENDLY):
      - Humans do not speak in codes. Do NOT include specific batch numbers, instrument IDs, lot numbers, or product codes.
      - Keep the event details minimal. Use generic terms like "the batch", "this equipment", "the product", or "the document".

      4. NAVIGATING HUMAN ERROR:
      - If the event points to human error, the tone must remain strictly non-accusatory and blame-free. 
      - Focus on identifying systemic or environmental factors. 
      - Probe for context: ask about distractions, fatigue, unusual conditions, or the clarity of instructions.
      - BAD: "Why did you forget to sign the logbook?" 
      - GOOD: "Were there any interruptions or unusual activities in the room when this step was being performed?"

      5. INVESTIGATIVE INTEGRITY:
      - Questions must be open-ended, not leading.
      - Do NOT ask about CAPA actions, corrective measures, or future plans. Focus purely on what happened leading up to and during the event.

      CONSTRAINTS & OUTPUT:
      - Return ONLY a valid JSON array of strings.
      - The length of questions should be a maximum of 100 words each.
      - 5 to 10 questions total, encompassing the full sequence from Failure to Procedure.
      - No duplicates.
      - Return an empty array [] if no relevant questions can be formulated.
      - Do not output any text, markdown, or explanations outside the JSON array.