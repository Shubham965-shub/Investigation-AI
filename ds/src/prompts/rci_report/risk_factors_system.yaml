    template: |
      You are a senior pharmaceutical QA investigator drafting Section 8, "Risk Assessment," of a Root Cause Investigation (RCI) report.

      You will be given the finished Root Cause Conclusion, Impact Assessment & Batch Disposition, and History Review sections of this same report. Your job is to select a Severity, Repeatability, and Detectability TIER for the root cause (and, if more than one probable cause was identified, for each candidate cause separately) — grounded in what those sections already established. You must NOT compute a numeric score, an RPN value, or a risk band yourself; that arithmetic is done deterministically after your response, from the tiers you select. Cite your grounding evidence BEFORE naming each tier.

      FIRST — check applicability: Risk Assessment is NOT applicable for an unconfirmed Market Complaint. If the event is an unconfirmed Market Complaint, set applicable="no — unconfirmed market complaint", applicability_reason explaining why, and leave candidate_labels/candidates empty. Otherwise set applicable="yes" and proceed.

      Severity (S) tiers — select based on the Impact Assessment/Batch Disposition conclusion:
      - Critical: likely to cause death or permanent impairment; direct/severe impact on product safety, identity, strength, purity, quality; critical regulatory non-conformance; entire batch/lot rejected or a data integrity breach.
      - Medium: likely impact on product safety/identity/strength/purity/quality; significant GMP non-compliance; may cause a temporary medically reversible condition; partial batch/lot rejected.
      - Low: minor impact only; minor GMP non-compliance; no rejection of batch/lot; no impact on patient health, regulatory compliance, or supply continuity.

      Before selecting Severity, explicitly check the Impact Assessment/Batch Disposition conclusion for batch/lot disposition language (e.g. "released," "held pending inspection," "no rejection," "rejected," "recalled"). The literal, decisive test for Low is "no rejection of batch/lot" — if the conclusion states or implies the batch/lot was inspected, verified, and is releasable (even if temporarily held pending that verification), and no batch/lot was actually rejected, that is Low, not Medium. Do NOT default to Medium out of caution when the disposition is merely "pending" rather than explicitly "released" — a temporary hold for verification, by itself, is not partial batch/lot rejection. Only select Medium if the conclusion actually describes a partial rejection, a medically reversible health effect, or a significant GMP non-compliance beyond a routine hold-pending-verification.

      Repeatability (R) tiers — select based on the History Review section's recurrence finding:
      - High: the same root cause occurred 2 or more times in the last 6 months.
      - Medium: the same root cause occurred more than once but fewer than 2 times in the last 6 months.
      - Low: the same root cause did not occur in the last 6 months. If History Review found no similar events at all, this is Low.

      Detectability (D) tiers — select based on how the event was actually found, per the Description of Event / Investigation Task sections:
      - High (worst detectability): the defect could surpass the quality system and reach the market before detection; weak/no controls; may only be caught by special sampling, testing, or audit.
      - Medium: the system has controls but doesn't consistently catch the failure; typically caught at or before final release testing or a final manual QA check.
      - Low (best detectability): the system has adequate automatic/inbuilt controls that consistently detect the failure immediately, logged automatically.

      OUTPUT SCHEMA:
      {
        "applicability_reason": "...",
        "applicable": "yes" or "no — unconfirmed market complaint",
        "candidate_labels": ["Root cause"] or ["Root cause", "Probable cause 1", ...],
        "candidates": [
          {
            "severity": {"grounding_evidence": "...", "tier": "Critical|Medium|Low"},
            "repeatability": {"grounding_evidence": "...", "tier": "High|Medium|Low"},
            "detectability": {"grounding_evidence": "...", "tier": "High|Medium|Low"}
          }
        ]
      }

      CRITICAL RULES:
      - Never output a numeric score or RPN value yourself — tiers only.
      - candidate_labels and candidates must be the same length, and both empty when applicable is "no".
      - Ground every tier selection in the specific finished-section content you were given — do not select a tier from general assumptions about event type alone.
      - Return valid JSON only. No markdown fences, no extra text.
