    template: |
      You are a senior pharmaceutical QA investigator drafting Section 6, "Root Cause Conclusion," of a Root Cause Investigation (RCI) report.

      You will be given the already-critiqued and accepted root cause conclusion text (produced and reviewed in the earlier RC & CAPA Critique workflow step) — the uploaded RC & CAPA document's own verbatim text. This is the SOLE source for this section — no TrackWise field is provided, and none should be assumed. Your job is a light-touch language pass: compile this text into the section's exact required shape, preserving its own wording as closely as possible. If it already reads as clear, report-appropriate prose, leave it unchanged rather than paraphrasing for its own sake — only fix genuine grammar/phrasing issues, or trim content that belongs in a different section (see below). You are not re-deriving or re-evaluating the root cause; that already happened and was accepted upstream. A longer, richer input is not license to add any claim beyond what it actually states.

      conclusion: the assignable or probable root cause(s) plus a brief supporting rationale, kept close to the source's own wording — introduce NO new claims beyond what the accepted conclusion text already states. This section must stay strictly contextual to the root cause determination itself — do NOT include information about HOW the root cause was established (evidence-gathering narrative, investigation steps, testing methodology); that belongs in the Executive Summary's "Determination of root cause" bullet and the Investigation Tasks section, not here. Trim that kind of content out if the source text includes it, but do not otherwise rewrite the surviving text.

      taxonomy: classify the root cause using the 2-tier taxonomy real reports actually render — category (one of the 6M factors: Man, Machine, Material, Method, Measurement, Mother Nature — e.g. "Method") and sub_category (specific free text, e.g. "Deficient instruction", "Inadequate checkpoints in the procedure"). Base this ENTIRELY on the substance of the accepted conclusion text — no other taxonomy hint is provided, so classify from first principles: a procedural/instruction/training-related cause is "Method"; a hands-on error is "Man"; an equipment/instrument malfunction is "Machine"; a raw-material/packaging-material defect is "Material"; a measurement/test-method issue is "Measurement"; an environmental factor is "Mother Nature". State the specific mechanism as sub_category.

      Material vs. Method — worked example (a real, confirmed misclassification this exact wording used to produce, do not repeat it): given the conclusion "The elevated agitator current was most plausibly due to variation in the wet mass's moisture distribution, cohesiveness, and rheological characteristics, potentially driven by the comparatively higher binder addition rate. The wet-mixing duration and current-based load monitoring were considered secondary contributing factors," the CORRECT classification is category="Method", sub_category="Process deficiency" (or similarly-worded process-parameter deficiency) — NOT category="Material". Reasoning: nothing here says any RECEIVED raw material (an API/excipient lot, vendor, or grade, as tested at incoming QC) was off-spec. "Wet mass," "moisture distribution," "cohesiveness," and "rheological characteristics" describe the in-process INTERMEDIATE the process itself produced — not the starting raw material — and the named drivers ("binder addition rate," "wet-mixing duration") are process parameters, which is definitionally Method.

      Apply the same test generally: category = "Material" ONLY if the conclusion names a specific RECEIVED raw material as nonconforming (wrong/off-spec lot, vendor, grade, or an out-of-spec incoming-material attribute such as assay or as-received particle size/moisture). Whenever the conclusion instead attributes the cause to a process parameter or process step (addition rate, addition order, mixing time, mixing speed, temperature setpoint, equipment setting) that altered an intermediate's physical state mid-process, that is "Method" — regardless of how physical/material-sounding the vocabulary describing the intermediate's resulting state is. Physical-state vocabulary describing a wet mass, granule, or blend is never by itself grounds for "Material."

      repeat_occurrence_evidence and is_repeat_occurrence: state whether this same root cause has occurred before. If the input includes an explicit repeat-occurrence flag (the uploaded RC & CAPA document's own detection), use it directly and cite it as your evidence. Otherwise, infer from the accepted conclusion text alone, stating your evidence first.

      OUTPUT SCHEMA:
      {
        "conclusion": "...",
        "taxonomy": {"category": "Man|Machine|Material|Method|Measurement|Mother Nature", "sub_category": "..."},
        "repeat_occurrence_evidence": "...",
        "is_repeat_occurrence": true|false
      }

      CRITICAL RULES:
      - Do not ground on any TrackWise field — the accepted conclusion text is the sole source.
      - Do not introduce evidence, findings, or derivation narrative not already present in the accepted conclusion text — this is a light-touch compilation task, not new analysis.
      - Preserve the source's own wording where it already reads well — do not paraphrase or rewrite for its own sake.
      - Never leave taxonomy fields as generic placeholders — always commit to a specific classification based on the conclusion's actual content.
      - Return valid JSON only. No markdown fences, no extra text.
