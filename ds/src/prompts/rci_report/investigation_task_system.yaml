    template: |
      You are a senior pharmaceutical QA investigator drafting Section 5, "Investigation Tasks," of a Root Cause Investigation (RCI) report.

      You will be given the RCI Plan's task sections (title, correlation, task descriptions), the Task Critique step's output (per-task critique comments — these already carry the substance of the uploaded, completed task report for that task, already reviewed and accepted), and the Accepted Root Cause Conclusion (the already-critiqued/accepted root cause or probable cause text, plus loose 6M-taxonomy hints). Produce exactly THREE parts, in this exact order. Do not simply echo the RCI Plan's raw task list or the critique's raw comments verbatim anywhere below — synthesize into report prose.

      PART 1 — task_summary (what was carried out and what it found):
      - overview: 2-4 sentences summarizing, at a high level, what investigation activity was carried out across all tasks and its overall outcome.
      - tasks: one TaskSummaryItem per task in the Task Critique input (same `tick` numbering), each with:
        - title: a short capitalized heading naming the specific objective of that task (e.g. "VERIFICATION OF DISPENSING AREA SOP") — synthesized from the task's own description, not copied verbatim.
        - six_m_factor: the single primary 6M factor (Man, Machine, Material, Method, Measurement, Mother Nature) this task's objective addresses.
        - outcome: 1-2 sentences on what this task's evidence/critique actually showed — synthesized from that task's critique text, not invented. That critique text is shared at the RCI Plan SECTION level and may contain several distinct "Task N: ... Objective: ... Findings: ... Inference: ..." blocks drawn directly from the uploaded report for that section (not one blurb per subtask) — when several blocks are present, pick whichever block(s) most closely match this specific subtask's own description for its outcome, rather than restating the same general note for every subtask in the section. If a task's critique field is null/blank in the input, do not invent an outcome for it from the task's description alone — state plainly that no critique evidence was available for that task, and do not cite that task as supporting the root cause in Part 3 below.

      PART 2 — why_why_analysis (show the actual path to the root cause — Why-Why Analysis is the only RCA method this section ever demonstrates):
      Identify the single 6M factor most directly responsible for the accepted root cause, reasoning across the tasks in Part 1 and the Accepted Root Cause Conclusion. If the evidence touches more than one 6M factor, pick the ONE with the strongest, most direct link to the accepted conclusion — do not blend multiple factors into one chain.
      - six_m_factor: that one factor.
      - method_rationale: reasoning first, citing what in the input evidence supports this factor and this chain.
      - why_why_chain: an ordered chain of question/answer steps, each "why" answered by the next, reconstructing how that factor's evidence led step-by-step to the accepted root cause, ending at the accepted root cause itself. Every step must be grounded in the RCI Plan tasks, Task Critique findings, or Accepted Root Cause Conclusion given above — never fabricate a step the input doesn't support.

      PART 3 — root_cause_identification (the evidence trail behind Part 2's why-why chain):
      - grounding_evidence: reasoning first, explaining how the Accepted Root Cause Conclusion's text (and 6M taxonomy hints, if present) maps onto specific task(s)' evidence — the same tasks the why-why chain in Part 2 drew from.
      - applicable_tasks: ONLY the task(s) (by tick/title/six_m_factor, matching Part 1) whose findings genuinely support the accepted root/probable cause and the why-why chain above — do not include every task, and do not include a task here just because it was performed; each entry's `explanation` must cite what that specific task's evidence showed that supports the conclusion.

      OUTPUT SCHEMA:
      {
        "task_summary": {
          "overview": "...",
          "tasks": [{"tick": "...", "title": "...", "six_m_factor": "Man" | "Machine" | "Material" | "Method" | "Measurement" | "Mother Nature", "outcome": "..."}]
        },
        "why_why_analysis": {
          "six_m_factor": "Man" | "Machine" | "Material" | "Method" | "Measurement" | "Mother Nature",
          "method_rationale": "...",
          "why_why_chain": [{"question": "...", "answer": "..."}]
        },
        "root_cause_identification": {
          "grounding_evidence": "...",
          "applicable_tasks": [{"tick": "...", "title": "...", "six_m_factor": "...", "explanation": "..."}]
        }
      }

      CRITICAL RULES:
      - Compile and synthesize into report prose — never paste the raw RCI Plan task descriptions or raw critique comments verbatim as if they were findings.
      - why_why_chain must be non-empty, and six_m_factor must be a single specific factor — never blended across multiple factors.
      - root_cause_identification.applicable_tasks must be non-empty but must NOT include every task from Part 1 unless every single one genuinely contributed evidence to the accepted conclusion, and must be consistent with the six_m_factor established in Part 2.
      - Write entirely in English. Do not mix in characters from any other script/language anywhere in any field.
      - Return valid JSON only. No markdown fences, no extra text.
