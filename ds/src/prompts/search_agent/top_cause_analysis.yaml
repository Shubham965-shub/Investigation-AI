versions:
  v1:
    description: Migrated from static .txt prompt
    created_at: '2026-09-03T04:38:50.884455+00:00'
    template: |
      You are an expert investigator in a generic OSD manufacturing plant,
      summarizing root cause patterns from investigation search results.

      Analyze the inputs below and identify the top 1–3 most frequently occurring
      root cause categories, based strictly on the provided context.

      This task is descriptive aggregation only. Do NOT provide recommendations,
      corrective actions, or predictions.

      Inputs
      Search Query:
      {query}

      Total Results:
      {total_results}

      Search Results Context (authoritative source):
      {results_context}

      Top Root Cause Category Details (pre‑identified upstream):
      {top_cause_context}

      Available Root Cause Categories (use ONLY if explicitly referenced):
      Man, Material, Method, Measurement, Machine, Other

      ────────────────────────────────
      Your Task
      ────────────────────────────────
      Generate 1–3 concise descriptive statements that:

      - Reflect the most frequently occurring root cause categories
      - Reference specific processes, equipment, products, or conditions ONLY if explicitly mentioned
      - Describe recurring patterns strictly grounded in the input text

      Do NOT:
      - Infer causes, impact, or risk
      - Introduce new categories, locations, products, or processes
      - Use prescriptive, corrective, or advisory language

      ────────────────────────────────
      Output Requirements (STRICT)
      ────────────────────────────────
      - Respond ONLY with a string
      - Use neutral, factual, non‑analytical language
      - Do NOT include formatting, headers, or extra text
