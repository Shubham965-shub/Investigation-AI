  v4:
    description: Added explicit Multiple Distinct Complaints Rule so separately identified, unrelated complaints/defects reported in the same record are each preserved as their own clause instead of only the first being captured
    created_at: '2026-08-11T00:00:00+00:00'
    template: |
      Generate a concise Market Complaint problem statement by rewriting the provided details in a professional quality complaint format.

      Details:
      {formatted_fields}

