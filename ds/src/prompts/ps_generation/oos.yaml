      Assay result for Amlodipine Besylate Tablets 10mg was reported as 94.2% against the specification limit of 95.0% to 105.0%, tested by Rekha Nair.
      Water content by KF result for Metformin Hydrochloride USP was reported as 0.85% against the specification limit of NMT 0.5%, tested by Vivek Chandran and reviewed by Anjali Menon.
      Assay by HPLC result for Losartan Potassium Tablets 50mg was reported as 97.5% against the specification limit of 95.0% to 105.0% for the initial batch, while a second batch analyzed in the same sequence was reported as 93.8% against the same limit.
      Assay by HPLC result for AMLODIPINE AND CHLORTHALIDONE TABLETS 5/12.5MG was reported as 93.4% against the specification limit of 95.0% to 105.0%, tested by Kiran Bhat.
  v5:
    description: 'Fixes, per the user, 2026-08-18/19: (1) Added Product Type Tag Rule so the product/material name carries its IP/FP/Stability/RM/PM classification when the "Product Type" field is provided; (2) replaced the Named Individual Preservation Rule with a Role-Only Reference Rule (analyst/reviewer names generalized to role, employee IDs dropped too), plus a Same-Role Disambiguation Rule for two people sharing one role; (3) broadened Parameter Name Quoting Rule to explicitly cover single-word analyte/element names (e.g. "Sodium", "Potassium"), not just multi-word/acronym parameters — fixes inconsistent quoting found via QA testing; (4) changed Product Type Tag Rule from an implied closed enum (IP/FP/Stability/RM/PM) to an explicit verbatim pass-through of whatever value the field holds (e.g. "Commercial") — fixes a reproducibility gap found via QA testing where identical input produced inconsistent tagging; (5) added, 2026-08-19, per QA testing (a case with an identical Product Type value producing a fabricated tag instead of the real one): explicit guard against deriving the Product Type tag from unrelated stability-study fields (Stability Protocol Number, Stability Condition, Stability Time Point) just because they are populated — those indicate a stability study, not that Product Type itself is "Stability"; (6) added, 2026-08-19, per QA testing (a Description-test result rendered as "...was reported as Abnormal and Bulging capsules observed..."): the Subject-Verb Agreement Rule (7) now also requires stripping a trailing verb from a descriptive-text result value when the source states it as "<Description>, <verb>", so the value reads as a clean noun phrase instead of two verbs stacked on one clause.'
