         - Preserve the parameter name's wording and casing exactly as given in the input; quoting must not change the text itself.

      10. Named Individual Preservation Rule:
          - If an analyst, reviewer, or other named individual is explicitly provided in the input — whether in a structured field (e.g. Analyst name) or embedded in the free-text description — you MUST include that specific name in the statement. Do not omit it and do not generalize it to a role-only reference (e.g. "the analyst", "the reviewer") when a named individual is given.
          - If more than one named individual is provided (e.g. both an analyst and a reviewer), include all of them.
          - Append named individuals as a trailing clause after the result/limit clause, e.g. "..., tested by <Analyst Name>" and/or "..., reviewed by <Reviewer Name>" — combine both with "and" when both are present. Do not let this clause replace or crowd out the result/limit clause.

      11. Multiple Batch/Sample Result Rule:
          - If the SAME test/parameter is reported for two or more distinct batches or samples (e.g. an additional sample explicitly noted as "also observed", "appended in the same sequence", or a second batch analyzed alongside the first), you MUST include EVERY batch's/sample's result — do not drop any of them.
          - Batch/AR/SR numbers still cannot appear (per the Conditional Field Inclusion Rule). Since you cannot use those identifiers to distinguish the results, use sequence/order language instead — e.g. "the initial batch", "a second batch in the same sequence", "an additional sample" — so each result is still attributable to a distinct batch without naming it.
          - Give each batch's result its own self-contained clause pairing it with its own limit (mirroring the Multiple Parameter/Result Rule's approach in rule 8, but keyed on batch/sample instead of named parameter), joined with "while" or "and".

      12. Full Product/Material Name Preference Rule:
          - If the structured product/material name field contains an abbreviated or coded short name (e.g. an internal SKU-style label from a product master list, such as "Amlo&ChlorthalidoneTabs 5/12.5mg30sUS-EX"), but the free-text description explicitly states the full, non-abbreviated product name elsewhere (e.g. "Product Name: AMLODIPINE AND CHLORTHALIDONE TABLETS 5/12.5MG"), use the FULL descriptive name in the problem statement instead of the abbreviated code — both refer to the same product, and the full name is what a reader needs.
          - Only use the abbreviated/coded name if no full descriptive name appears anywhere in the source.

      Structure:
      - Single parameter: <Test Parameter/Activity Name> result for <Product/Material Name> was reported as <Observed Result> against the specification limit of <Specification Limit>.
      - Single named parameter (distinct from test/method name): '<Parameter>' result for <Product/Material Name> was reported as <Observed Result> against the specification limit of <Specification Limit>.
      - Multiple parameters under one test: During <Test Parameter/Activity Name> testing for <Product/Material Name>, '<Parameter A>' was reported as <Result A> against the specification limit of <Limit A>, and '<Parameter B>' was reported as <Result B> against the specification limit of <Limit B>.
      - With named individual(s): <any of the above clauses>, tested by <Analyst Name>[, and reviewed by <Reviewer Name>].
      - Multiple batches/samples of the same test: <Test Parameter/Activity Name> result for <Product/Material Name> was reported as <Result A> against the specification limit of <Limit A> for the initial batch, while a second batch in the same sequence was reported as <Result B> against the specification limit of <Limit B>.

