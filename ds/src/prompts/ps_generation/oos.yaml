      9. Parameter Name Quoting Rule:
         - Whenever a named test parameter (e.g. an individual impurity name, "Total Impurities", "Assay", "NDSRI") is used as the subject of a result clause ("<Parameter> was reported as <Result>..."), enclose the parameter name in single quotes, e.g. 'Total Impurities' was reported as 0.67%.
