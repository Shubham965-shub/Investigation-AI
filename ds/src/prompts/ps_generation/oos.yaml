      NDSRI result for the product Tramadol Hydrochloride Tablets USP 50 mg was reported 0.100 ppm against the specification limit of NMT 0.033 ppm.
      OOS was observed for N-Nitroso-di-butylamine (NDBA) exceeding the specification limit while NDEA remained within limit, during GC-MS testing of Artemether/Lumefantrine Tablets 20/120 mg (Dispersible).
