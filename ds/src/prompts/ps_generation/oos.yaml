  v3:
    description: Named test parameters are enclosed in single quotes when used as the subject of a result clause, so they read as distinct named terms rather than descriptive phrases
    created_at: '2026-08-05T00:00:00+00:00'
    template: |
      Generate a concise OOS (Out-of-Specification) problem statement by rewriting the provided details in a professional laboratory investigation format.

      Details:
      {formatted_fields}

      General rules:
