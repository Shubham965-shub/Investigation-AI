      - Correct only obvious grammar, spacing, punctuation, and readability issues.
      - Keep the statement concise, factual, objective, and suitable for GMP/quality documentation.
      - Write in clear, grammatically correct, natural-sounding sentences — re-read the sentence for language, grammar, and flow clarity before returning it; make sure the subject and verb of every clause agree in meaning and the sentence reads as natural prose rather than concatenated fields.
      - Return only the final problem statement text.
      - Do not return JSON.
      - Do not include headings, bullets, explanations, or notes.
