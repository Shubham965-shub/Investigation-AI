active: v3
versions:
  v1:
    description: Original OOT prompt — batch number included in output if provided
    created_at: '2026-06-12T00:00:00+00:00'
    template: |
      Generate a concise OOT (Out-of-Trend) problem statement by rewriting the provided details in a professional laboratory investigation format.

      Details:
      {formatted_fields}

      General rules:
      - Use ONLY the information explicitly provided in the input fields.
      - Do not include date or time information in the problem statement even if provided in the input fields.
      - Do NOT infer, assume, calculate, expand, or add missing information.
      - Do NOT mention that information is missing, not provided, unknown, or unspecified.
      - Do NOT add root cause, impact assessment, CAPA, corrective action, preventive action, conclusion, or investigation outcome.
      - Do NOT change factual values such as dates, times, batch numbers, product names, equipment IDs, employee IDs, observed values, limits, SOP numbers, or instrument IDs.
      - Preserve the original meaning and event flow as much as possible.
      - Correct only obvious grammar, spacing, punctuation, and readability issues.
      - Keep the statement concise, factual, objective, and suitable for GMP/quality documentation.
      - Return only the final problem statement text.
      - Do not return JSON.
      - Do not include headings, bullets, explanations, or notes.
      - Use the structure in Structure section below as a guideline if applicable, but only if it can be directly supported by the input data.
      - Refer the real world examples for the expected style and format of the problem statement for each event type.

      OOT-specific rules:

      1. Clearly state that an OOT or Out-of-Trend result was observed/reported/found.
      2. Preserve all provided numerical values exactly.
      3. Include only details explicitly present in the source input.
      4. Do not infer or fabricate missing metadata.
      5. Do not convert OOT into OOS.
      6. Keep the narrative concise and GMP/QMS compliant.
      7. Additional metadata should remain in structured fields unless explicitly mentioned in the source narrative.
      8. Preserve phrases like "details mentioned below" and "results tabulated below" exactly if present.
      9. Do not include date or time information in the problem statement even if provided in the input fields.

      Structure:
      - <Test Parameter/Activity Name> result for the product <Product/Material Name> <Batch/SR Number if available> was reported <Observed Result>, against the OOT limit of <OOT Limit>.

      Real-world examples for reference:
      Assay result for the product Macrogol Plus Electrolytes[13.72g] was reported 102.2%, against the OOT limit of 98.0% to 101.7%.
      Assay by HPLC result for the product Ibuprofen Oral Suspension 40 mg/mL (BULK HTS 21 DAYS) was reported as 96.7%, against the OOT limit of +/-3.0% of the target value 100.0%.
      FP assay by HPLC (Stability-N2560-12M) result for the product Acarbose Tablets [50 mg], Batch No. 7257683, was reported with an OOT result.
      FP assay by HPLC (Stability-N2560-12M) result for the product Acarbose Tablets [25 mg], Batch No. 7257682, was reported with an OOT result.
      Dissolution by HPLC result for the product Prednisone Tablets USP 2.5 mg, batch number 7262112, was reported as 106%, 104%, 115%, 117%, 113%, and 126% with an average of 113.5%, against the specification limit of NLT 85% (Q=80) of the labelled amount of Prednisone Tablets USP 2.5 mg.
      Assay by HPLC result for the product Dosulepin Tablets [75 mg] (Core HTS 60 Days) was reported as 95.9%, against the OOT limit of +/-3% of target value 100%.
      Assay by HPLC result for the product Acarbose Tablets [50 mg], batch number 7261888, was reported as 108.0%, against the OOT limit of Minimum: 96.6% and Maximum: 105.7%.
      Dissolution by HPLC result for the product Ursodiol Capsules USP 150 mg, batch number 7262036, was reported with an OOT result during result review and LIMS entry.
      Compression stage yield result was reported as 92.92% against the BMR limit of 97% to 100% during batch reconciliation activity.
      Preservative content by HPLC result for the product Benzonatate Capsules USP [100 mg and 200 mg] was reported with out-of-trend results during LIMS entry. The obtained results were tabulated below.
      Dissolution test result for Extended Phenytoin Sodium Capsules 100 mg, batch number 7261819, was reported with OOT results during LIMS. Observed results are tabulated below.
      Assay by HPLC result for the product Prednisone Tablets [25 mg], batch number 7261326, was reported as 95.3%, against the OOT limit of 97.0% to 103.0%.
      Dissolution by HPLC result for the product Ursodiol Capsules USP 150 mg, batch number 7262036, was reported as D1: 95%, D2: 62%, D3: 91%, D4: 100%, D5: 72%, D6: 90%, Avg.: 85%.
      Assay by HPLC result for the product Oxybutynin Hydrochloride Tablets [2.5 mg] (LG HTS 30 DAYS) was reported as 105.0%, against the OOT limit of +/-3% of target value 100%.
      Assay by HPLC result for the product Dosulepin Tablets [75 mg] (Core HTS 60 Days) was reported as 95.9%, against the OOT limit of +/-3% of target value 100%.
      Assay by HPLC result for the Stability sample Acarbose Tablets [50 mg], batch number 7257683A_N2560-12M, was reported as 109.8%, against the OOT limit of +/-5.0% from the previous time point result of 104.7%.

