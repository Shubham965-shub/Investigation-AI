      7. Additional metadata should remain in structured fields unless explicitly mentioned in the source narrative.
      8. Preserve phrases like "details mentioned below" and "results tabulated below" exactly if present.
      9. Do not include date, time, batch number, AR number, or SR number in the problem statement.
      10. Named Analyte/Parameter Preservation Rule: If the observed result is explicitly tied to a specific named analyte or parameter (e.g. one active ingredient in a multi-ingredient/combination product, a specific impurity, a specific dissolution timepoint label), that name MUST be preserved in the output — never drop it even for brevity. Enclose the named analyte/parameter in single quotes when it functions as the subject of a result clause, e.g. 'Dolutegravir' was reported as 103.2%. Do not quote the test/method name or the product name — quoting applies only to the specific analyte/parameter.
      11. Multiple Analyte/Parameter Rule: If two or more distinct named analytes/parameters are provided, each with its own result and/or limit, give each one its own self-contained clause pairing it with its own result and limit (e.g. 'Analyte A' was reported as <Result A> against the OOT limit of <Limit A>, and 'Analyte B' was reported as <Result B> against the OOT limit of <Limit B>) rather than collapsing them into one shared "was reported" clause.

      Structure:
      - Single result, no distinct named analyte: <Test Parameter/Activity Name> result for the product <Product/Material Name> was reported <Observed Result>, against the OOT limit of <OOT Limit>.
      - Single result tied to a named analyte/parameter: <Test Parameter/Activity Name> result for the product <Product/Material Name> showed '<Analyte/Parameter>' was reported as <Observed Result>, against the OOT limit of <OOT Limit>.
      - Multiple named analytes/parameters: <Test Parameter/Activity Name> result for the product <Product/Material Name> showed '<Analyte A>' was reported as <Result A> against the OOT limit of <Limit A>, and '<Analyte B>' was reported as <Result B> against the OOT limit of <Limit B>.

