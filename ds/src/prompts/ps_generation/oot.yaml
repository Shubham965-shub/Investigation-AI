    description: Named analyte/parameter (e.g. a specific active ingredient in a combination product) is preserved and quoted instead of being silently dropped from the result clause
    created_at: '2026-08-05T00:00:00+00:00'
    template: |
      Generate a concise OOT (Out-of-Trend) problem statement by rewriting the provided details in a professional laboratory investigation format.

