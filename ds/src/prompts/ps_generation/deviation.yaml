    description: "Bug fix, 2026-08-24: record 507382 (a Deviation) generated \"the individual observed deshaped capsules...\", the neutral no-role fallback, even though the named observer (Manjunath Marappan) had no title stated anywhere in the free text — which is technically correct per the old Role-First Reference Rule, but the record's structured Department field (\"Packing Department\", newly plumbed through field_mapping.py's Deviation fields alongside Deviation To) was available and unused. Extended the Role-First Reference Rule so that before falling back to the neutral \"the individual\" reference, the model must check the structured Department field and derive a role from it (e.g. \"Packing Department\" -> \"the packing personnel\") when the free text itself states no title. Added Example 22, reproducing record 507382. Follow-up fix, same day: a 5-record regression sweep against this first cut of the rule surfaced two new failure modes. (1) Record 507588 had an explicitly stated role (\"Analyst\", typo'd \"Analyt\") in the free text, but the model used the Department-derived \"production personnel\" instead — Department was wrongly treated as equal-or-better than a stated role. (2) Record 507567's free text stated the role \"production personnel\" for the observer, but the Department field held a different value (\"Packing Department\") for the same record, and the model incorrectly substituted the Department-derived \"the packing personnel\", overriding the record's own stated role. (3) Records 507514 and 507510 have NO individual referenced anywhere in their free text (passive/system-generated observations), yet the model still fabricated a Department-derived role (\"the production personnel\", \"the Facilities & Engineering personnel\") for a person the source never mentions. Rewrote the rule to make the priority order and scope explicit: Department is consulted ONLY when the free text names a specific individual with no stated role, a stated role (however informal) always wins over Department when the two conflict, and no role of any kind is introduced when the free text does not reference any individual at all. Added Example 23 (stated role beats a conflicting Department value) and Example 24 (no individual mentioned in the source — no role fabricated, matching Example 15's existing no-observer pattern). Second follow-up, same day: record 507510 (phrased as \"has been identified...\" rather than Example 24's \"observed that...\") still fabricated \"the Facilities & Engineering department\" as an active observer — restating the no-individual-mentioned guardrail wasn't enough to generalize across this different passive phrasing, and the model was still forcing an active \"<role> observed\" construction to fill the Structure's observer slot. Per the user, when the source is passive/system-generated, the whole statement must stay passive — \"observed that\"/\"identified that\" is not required just to satisfy the Structure. Made this explicit in the rule and added Example 25, reproducing 507510 verbatim with the corrected fully-passive expected output. Third follow-up, same day: the passive-voice instruction was applied too broadly by the model — re-testing 507588 (the \"Analyt\"/\"Analyst\" typo case) and 507597 (the two-named-individuals case) after the 507510 fix showed both regressed to fully passive, dropping a role that should have been included, even though each record DOES reference at least one individual. Tightened the rule so the fully-passive/no-subject treatment is explicitly gated on the free text referencing ZERO individuals anywhere — a misspelled/informal role or the presence of multiple people is explicitly called out as NOT qualifying for the passive case; whenever at least one individual is referenced, an observer/role reference is still required per the existing priority rules."
