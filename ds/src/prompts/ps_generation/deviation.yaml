    description: "Bug fix / rule change, 2026-08-21: a dry run of a real Deviation record (a backup-schedule non-conformance against SOP AL/IT/052) against the active v5 prompt surfaced two issues, and the user separately asked for two more changes to land in this same version rather than new versions. (1) The output leaked raw calendar dates (\"13/06/2025 to 25/07/2025\") into the problem statement — a direct violation of the file's own date-exclusion rule — because the only way the model had to express \"the interval exceeded the 20-30 day requirement\" was via the two source dates, and it is not allowed to calculate the actual day-gap itself. Added a Date-Derived Interval Rule clarifying that a stated duration/frequency requirement (e.g. \"20 to 30 days\") is not a banned \"date\" and may be preserved, but the observed side of the comparison must be phrased qualitatively when only raw calendar dates are available in the source — never leaked as dates, and never a self-calculated duration. (2) The output still failed to preserve the specific Annexure (Annexure 15) cited as the authority for that interval requirement — the same failure mode the Supporting Citation Preservation Rule and Example 15 already target, just for a different record's citation (Example 15 models an Annexure 7/9 pair in a calibration-domain analogue; this record's own Annexure 15/19 pair was never itself represented in the prompt). Added Example 20, reproducing this exact record, so both fixes are modeled directly — restating the citation rule alone previously did not make it stick for this pattern. (3) Per the user, equipment/instrument IDs are not required and must be excluded from the problem statement, the same way batch numbers and AR numbers already are — the equipment/instrument's NAME may still be mentioned. Previously the \"Preserve all identifiers\" rule explicitly told the model to preserve equipment IDs and instrument IDs, which is why an earlier dry-run output on record 469261 included \"(Equipment ID: SGC/PLM/080)\". Added a dedicated Instrument/Equipment ID Exclusion Rule, removed equipment/instrument IDs from the preserve-identifiers list and from the General/Deviation-specific banned-items lists' complement, and fixed Examples 14, 16, 18, and 20, which previously surfaced an instrument or equipment ID (1070-HPLC-5510, 1070-HPLC-2290, 1070-DISA-2210, SGC/PLM/080) in their expected output — each now keeps the instrument/equipment NAME where one is explicitly given (Example 18's \"Dissolution Apparatus\", Example 20's \"Planetary mixer\") and drops the reference entirely where only a bare ID exists with no separate name (Example 16 had only an ID with no separate name, so the instrument mention is dropped rather than fabricating one). (4) Broader dry-run testing across 5 additional real Deviation records surfaced a Same-Role Disambiguation regression on record 474988 (Quinine Sulfate, sequence interrupted by a controller shutdown) — the source names two different analysts sharing the SAME role (Treesa Johny initiated the test, Avishek Das found the interruption a day later), which the Same-Role Disambiguation Rule already covers almost verbatim in its own rule text, and a near-identical pattern (Example 16, a sequence interrupted at Bin No. 8) already exists as a worked example — yet the model still collapsed both people into a single \"the analyst observed\" reference, dropping the initiating analyst entirely. Restating the rule text alone was insufficient (it was already correct), so: broadened the rule to explicitly cover any verb (\"initiated,\" \"found,\" \"identified,\" \"noted,\" etc.) and any event type (numeric result failure OR a mechanical/process event like a sequence interruption or equipment shutdown), and explicitly forbade keeping only whoever most directly \"found\" the issue while treating the other person's action as incidental setup; added Example 21, reproducing record 474988 verbatim, since a same-topic example (16) already existed but evidently was not close enough in verb choice (\"observed\" vs. \"found\") to generalize reliably."
