active: v4
versions:
  v1:
    description: Original deviation prompt — output-only examples, batch number preserved in output
    created_at: '2026-06-12T00:00:00+00:00'
    template: |
      Generate a concise Deviation problem statement by rewriting the provided details in a professional GMP-compliant format.

      Details:
      {formatted_fields}

      General rules:
      - Use ONLY the information explicitly provided in the input fields.
      - Do not include date or time information in the problem statement even if provided in the input fields.
      - Do NOT infer, assume, calculate, expand, or add missing information.
      - Do NOT mention that information is missing, not provided, unknown, or unspecified.
      - Do NOT add root cause, impact assessment, CAPA, corrective action, preventive action, conclusion, or investigation outcome.
      - Do NOT change factual values such as dates, times, batch numbers, product names, equipment IDs, employee IDs, observed values, limits, SOP numbers, or instrument IDs.
      - Preserve the original meaning and event flow as much as possible.
      - Correct only obvious grammar, spacing, punctuation, and readability issues.
      - Keep the statement concise, factual, objective, and suitable for GMP/quality documentation.
      - Return only the final problem statement text.
      - Do not return JSON.
      - Do not include headings, bullets, explanations, or notes.
      - Use the structure in Structure section below as a guideline if applicable, but only if it can be directly supported by the input data.
      - Refer the real world examples for the expected style and format of the problem statement for each event type.

      Deviation-specific rules:

      * Do not include date, time, timestamp, duration, or clock references in the problem statement, even if provided in the input.
      * Describe only the observed deviation, discrepancy, abnormality, defect, non-conformance, or documentation error.
      * Use only information explicitly provided in the input.
      * Mention product/material name, batch number, activity/stage, area, line, equipment, instrument, document reference (SOP/BMR/BPR/STP), observed value, and requirement/limit only if explicitly provided.
      * Mention the observer, reviewer, operator, analyst, department, or function only if explicitly provided and relevant to the observation.
      * If both an observed value and a requirement/limit are provided, state them together in the format: "<observed value> against <requirement/limit>".
      * Preserve all identifiers exactly as provided, including batch numbers, AR numbers, equipment IDs, instrument IDs, SOP numbers, document references, employee IDs, and sample identifiers.
      * Do not introduce root cause, impact, risk, product quality assessment, investigation details, CAPA, corrective action, preventive action, conclusion, or outcome unless explicitly stated in the source text.
      * Do not use subjective, interpretive, or speculative language.
      * For multiple observations, repeated measurements, time-series data, tabulated results, or trend data, summarize the observed condition and applicable requirement/limit without listing individual readings, timestamps, or measurement points.

      Activity Context Rules:

      * Begin the statement with an activity context that identifies where or during which activity the issue was observed.
      * The activity context must be derived only from information explicitly present in the input.
      * Use the most specific activity associated with identification of the issue.
      * Do not infer, generalize, or create activities that are not stated.
      * Preferred activity context formats include:
        * During review of ...
        * During analysis of ...
        * During testing of ...
        * During inspection of ...
        * During verification of ...
        * During reconciliation of ...
        * During qualification of ...
        * During execution of ...
        * During retrieval of ...
        * During manufacturing activity ...
        * During packing activity ...
        * During LIMS entry ...
        * Upon review of ...
        * While performing ...

      KPI / Attribute / Condition Rules:

      * Clearly state the specific KPI, attribute, condition, record, result, parameter, equipment status, document field, or requirement involved in the deviation.
      * Use the most specific observable fact available from the input.
      * Avoid generic phrases such as: issue observed, discrepancy noted, problem identified, deviation found.
      * Prefer specific observations such as: batch number updated incorrectly, AR number entered incorrectly, audit trail entry deleted, yield observed below limit, product traces observed, qualification status missed, training not included in curriculum.

      Structure:

      <Activity context>, <observer/role if relevant> observed <KPI/attribute/condition> <observation statement>.

          Where:
          - For a single observation:
          <observation statement> = "as <observed value> against <requirement/limit>"

          - For multiple observations, repeated measurements, trend data, or tabulated results:
          <observation statement> = "outside the <requirement/limit>"
          OR
          <observation statement> = "not meeting the <requirement/limit>"
          OR
          <observation statement> = "exceeding the <requirement/limit>"
          OR
          <observation statement> = "below the <requirement/limit>"

      <Activity context>, <observer/role if relevant> identified that <specific record, field, identifier, status, or condition> was <incorrectly entered, updated, recorded, assigned, deleted, omitted, or not performed>.

      The final statement should be concise, factual, GMP-compliant, and typically written as a single sentence.

      Real-world examples:
      During material verification of Mycophenolate Mofetil Tablets 500 mg (Batch No. 7261492), it was observed that the lot details of dispensed Povidone USP-K-30 were not aligned with the e-BMR, as the binder was dispensed in 4 lots instead of the required 8 sub-lots in the granulation area.
      During reconciliation at the unloading stage, the yield of Benzonatate Capsules 200 mg (Batch No. 7261714) was found to be 92.26%, as per BMR specified limit of 96%–101%.
      During the BU test by HPLC for Lamotrigine Tablets 200 mg, the %RSD was found to be 7.10%, against the protocol acceptance limit of NMT 3.0%.
      During audit trail verification of the cartonator machine for Macrogol 13.72g (Batch No. 7261770A), it was observed that batch creation and machine settings data were not captured in the audit trail report despite being performed.
      During in-process checks of Sevelamer Carbonate 2.4 g (Batch No. 7261250A), the OCV challenge test for missing and incorrect coding failed as it did not meet the BPR acceptance criteria.
      During review of raw data for Working Standard 1070-WS-250003 of Vancomycin HCl, Ms. Mallem Nagamani identified missing pages, and it was observed that analyst Mr. Divakar K used an incorrect sample instead of the designated reference standard for re-evaluation.
      During SFG appearance check, Mr. Monidul Islam observed defects such as capping, sticking, and edge cracking in Quinine Sulphate Tablets BP 300 mg (Batch No. 7264453A) at the primary packaging area.
      During preparation of Calcitriol Capsules 0.25 mcg (Batch No. 755050), it was observed that the homogenizer shaft slipped and fell into the batch mixture vessel due to disengagement of the stirrer assembly from the top socket.

