  v4:
    description: 'Consolidated fix (squashed from this session v4-v8 iterations; remote was at v3): (1) Multiple Distinct Observations Rule - separately numbered/unrelated observations are each preserved instead of collapsed; (2) Multiple Named Individuals Identifiers Rule - every named persons employee ID is preserved, not just one; (3) Multiple Roles In One Finding Rule - multiple named individuals contributing to ONE finding, not just across separate observations, are all preserved with their roles; (4) Customer/Organization Name Preservation Rule - named customers/organizations are preserved, not generalized to a role phrase; (5) Supporting Citation Preservation Rule - a document/annexure cited as the authority behind a requirement is preserved alongside a different citation that is the subject of another finding. Found and fixed via the ps_generation golden-corpus harness, 2026-08-11'
