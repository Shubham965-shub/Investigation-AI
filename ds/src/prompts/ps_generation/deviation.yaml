    template: |
      Generate a concise Deviation problem statement by rewriting the provided details in a professional GMP-compliant format.

      Details:
      {formatted_fields}

      General rules:
      - Use ONLY the information explicitly provided in the input fields.
      - Do not include date, time, batch number, AR number, SR number, equipment ID, or instrument ID in the problem statement, even if provided in the input fields.
      - Do NOT infer, assume, calculate, expand, or add missing information.
      - Do NOT mention that information is missing, not provided, unknown, or unspecified.
      - Do NOT add root cause, impact assessment, CAPA, corrective action, preventive action, conclusion, or investigation outcome.
      - Do NOT change factual values such as product names, employee IDs, observed values, limits, or SOP numbers.
      - Preserve the original meaning and event flow as much as possible.
      - Correct only obvious grammar, spacing, punctuation, and readability issues.
      - Keep the statement concise, factual, objective, and suitable for GMP/quality documentation.
      - Return only the final problem statement text.
      - Do not return JSON.
      - Do not include headings, bullets, explanations, or notes.
      - Use the structure in Structure section below as a guideline if applicable, but only if it can be directly supported by the input data.
      - Refer the real world examples for the expected style and format of the problem statement for each event type.

      Deviation-specific rules:

      * Do not include date, time, timestamp, duration, clock references, batch number, AR number, SR number, equipment ID, or instrument ID in the problem statement.
      * Describe only the observed deviation, discrepancy, abnormality, defect, non-conformance, or documentation error.
      * Use only information explicitly provided in the input.
      * Mention product/material name, activity/stage, area, line, equipment, instrument, document reference (SOP/BMR/BPR/STP), observed value, and requirement/limit only if explicitly provided.
      * Full Product/Material Name Preference Rule: If the structured product/material name field contains an abbreviated or coded short name (e.g. an internal SKU-style label from a product master list, such as "Amlo&ChlorthalidoneTabs 5/12.5mg30sUS-EX"), but the free-text description explicitly states the full, non-abbreviated product name elsewhere (e.g. "Product Name: AMLODIPINE AND CHLORTHALIDONE TABLETS 5/12.5MG"), use the FULL descriptive name in the problem statement instead of the abbreviated code — both refer to the same product, and the full name is what a reader needs. If no full descriptive name appears anywhere else in the source, and the structured product/material name is itself a fused, spaceless string combining the drug name, dosage form, strength, pack size, and/or brand/manufacturer suffix (e.g. "AlfacalcidolSGC1.0mcg30'sZentiva-Italy"), do NOT use that raw fused string as-is — reformat it into a readable name by inserting spaces at the natural word/number boundaries, keeping only the drug name, dosage form, and strength, and dropping the trailing pack-size (e.g. "30's") and brand/manufacturer suffix (e.g. "Zentiva-Italy"), e.g. "AlfacalcidolSGC1.0mcg30'sZentiva-Italy" → "Alfacalcidol SGC 1.0 mcg". Only keep the raw fused string as-is if it cannot be confidently split into these components.
      * Instrument/Equipment ID Exclusion Rule: Do NOT include an equipment ID, instrument ID, or serial/asset number (e.g. "Equipment ID: SGC/PLM/080", "1070-HPLC-2290", "1070-DISA-2210") in the problem statement, even when explicitly provided in the input — treat these the same as batch numbers and AR numbers, which are already excluded. The equipment or instrument's NAME (e.g. "Planetary mixer", "Dissolution Apparatus", "HPLC system") is NOT an ID and may still be mentioned when explicitly provided, per the rule above — only the numeric/alphanumeric identifier itself is excluded. If the source gives ONLY an ID with no separate name for that piece of equipment/instrument, drop the equipment/instrument reference entirely rather than fabricating a generic name for it.
      * Role-First Reference Rule: Never include a person's name in the problem statement, under any circumstance — always generalize the individual to a reference instead. When the source gives the individual a real, recognizable functional role or title, generalize to that role (e.g. "the supervisor", "the operator", "PDN person", "IPQA personnel") — and do not attach that person's employee ID next to the role either. If the source gives NO real, usable functional role for the individual (e.g. a bare field label such as "Prepared By: Akash" with no title), generalize to a neutral, non-identifying reference such as "the individual" instead — never fall back to using their name, and never attach an employee ID to that neutral reference either. Do NOT invent a specific, unstated role (e.g. writing "the supervisor" when no title was actually given in the source) — only use a role that is explicitly stated, even an abbreviated one; otherwise use the neutral "the individual" reference. This does not apply to named customers/vendors/organizations, which are covered separately below.
      * Customer/Organization Name Preservation Rule: If a specific customer, vendor, auditor organization, or other named entity is explicitly provided and relevant to the activity context (e.g. "the ClearPath Labs customer audit"), you MUST include that specific name — do not generalize it to a role-only reference (e.g. "the customer audit", "a vendor audit") when a named organization is given in the input. This applies the same principle as the individual-name rule above to organization names.
      * If both an observed value and a requirement/limit are provided, state them together in the format: "<observed value> against <requirement/limit>".
      * Preserve all identifiers exactly as provided, including SOP numbers, document references, employee IDs, and sample identifiers. Do NOT include batch numbers, AR numbers, equipment IDs, or instrument IDs — see the Instrument/Equipment ID Exclusion Rule above.
      * Supporting Citation Preservation Rule: A document reference can play two different roles in an observation — (a) it can BE the subject of the finding itself (e.g. "the checklist, Annexure 19, was not performed"), or (b) it can be cited as the AUTHORITY/BASIS for a requirement that was violated (e.g. "the interval must be 20-30 days per SOP X, Annexure 15"). Preserve BOTH kinds — do not drop a supporting-authority citation just because a broader SOP name for the same requirement is already mentioned, and do not drop it in favor of a different citation that is the subject of another finding in the same statement. If an observation states a specific requirement/limit AND cites a specific clause/annexure/section number as where that requirement comes from, include that specific number alongside the requirement, not just the parent SOP name.
      * Date-Derived Interval Rule: A stated requirement/limit that is itself a duration or frequency (e.g. "once every 90 days", "between 20 and 30 days") is NOT a banned "date" under the date-exclusion rule above — preserve it exactly as given, since it is a requirement value, not a calendar date. However, if the only way to express what was actually observed is by citing the underlying calendar dates the interval would be computed from (e.g. two activity dates, such as two backup dates in different months), do NOT include those calendar dates in the problem statement, and do NOT calculate the elapsed duration between them yourself — that would be adding information not explicitly given. Instead, state the observed condition qualitatively without asserting a specific actual duration or date, e.g. "was not carried out within the required interval" rather than leaking the raw dates or computing a date-derived value.
      * Same-Role Disambiguation Rule: If a single finding involves two or more individuals who share the SAME role (e.g. two different analysts — one who initiated a step, another who observed the issue), do not collapse them into one ambiguous "the analyst" reference — distinguish them by what each one did or by sequence (e.g. "one analyst" / "a second analyst", or "the initiating analyst" / "the observing analyst"), the same way the Multiple Batch/Sample Result Rule elsewhere disambiguates same-parameter results by sequence rather than by name. This applies regardless of which verb the source uses for each person's action — "initiated," "started," "performed," "observed," "found," "identified," "noted," etc. all count — and regardless of whether the finding is a numeric result failure or a mechanical/process event (e.g. a sequence interruption, an equipment shutdown, a system malfunction). Do NOT keep only the person who most directly "found" or "identified" the end result and silently drop the other just because their action (e.g. merely "initiating" a test) seems like incidental setup — if the source names two people sharing a role within the SAME finding, both must appear, no matter which of their two actions reads as more central to the narrative.
      * Multiple Roles In One Finding Rule: If a SINGLE finding involves more than one individual in different roles (e.g. one person performed/initiated the activity, a different person observed/identified the issue, another reviewed or verified it), you MUST include EVERY one of their roles — do not keep only the role of whoever observed/identified the issue and drop the others. Use the primary <role if relevant> slot in the Structure below for whoever directly observed/identified the deviation, and append the other individuals' roles as trailing clauses, e.g. ", performed by <Role A>" and/or ", reviewed by <Role C>" — mirroring how OOS/OOT statements append "tested by ... and reviewed by ...". Use each person's real functional role if one is stated, or a neutral non-identifying reference (e.g. "the individual") if no real role is given, per the Role-First Reference Rule above. This is distinct from the Same-Role Disambiguation Rule above, which covers two people sharing the identical role within one finding.
      * Weight/Yield Percentage Preference Rule: If the source states the SAME underlying quantity (e.g. batch yield, material weight, fill weight) BOTH as a percentage against a percentage limit AND as an absolute weight/quantity (e.g. in kg, g, or units) against a corresponding absolute limit, use ONLY the percentage value and its percentage limit in the problem statement — do NOT also state the absolute weight/quantity value, even though it was explicitly provided. The percentage is the normalized, comparable figure; restating the same fact again in absolute units is redundant, not a second finding.
      * Do not introduce root cause, impact, risk, product quality assessment, investigation details, CAPA, corrective action, preventive action, conclusion, or outcome unless explicitly stated in the source text.
      * Do not use subjective, interpretive, or speculative language.
      * Repeated Measurement Summarization Rule: For a single finding backed by repeated measurements, time-series data, tabulated results, or trend data of the SAME parameter, summarize the observed condition and applicable requirement/limit without listing individual readings, timestamps, or measurement points.
      * Multiple Distinct Observations Rule: If the input describes two or more separately identified, unrelated observations or findings — such as those explicitly numbered or labeled "Observation 1", "Observation 2", etc., or describing different activities, dates, materials, documents, records, or people — you MUST include EVERY distinct observation in the problem statement. Do NOT drop, merge into one, or summarize away any numbered/distinct observation. Give each observation its own clause following the Structure below (its own activity context, KPI/attribute/condition, and observation statement), and join the clauses with "Additionally," (or "; " for a terser join). This rule is distinct from the Repeated Measurement Summarization Rule above, which applies only when multiple data points describe the SAME finding/parameter, not when they describe genuinely separate findings.

      Activity Context Rules:

      * Begin the statement with an activity context that identifies where or during which activity the issue was observed.
      * The activity context must be derived only from information explicitly present in the input.
      * Use the most specific activity associated with identification of the issue.
      * Do not infer, generalize, or create activities that are not stated.
      * No Fabricated Activity Rule: Do NOT default to "inspection" (or any other activity word) as generic filler when the input does not explicitly state that activity — this includes cases where a piece of equipment mentioned in the observation (e.g. "Rapid Mixer Granulator") tempts a plausible-sounding but unstated activity like "inspection of the Rapid Mixer Granulator." The activity context must name the actual process/activity stated in the input (e.g. "granulation," "packing," "review"), not an activity implied by an equipment or product name that happens to appear in the observation. If the only activity explicitly stated is, say, "granulation," use that — do not substitute "inspection" of a piece of equipment named later in the same sentence, and do not repeat that equipment's name in both the activity context and the observation clause.
      * Activity Must Come From an Actual Stated Action, Not a Field Name Rule: The activity context must be built from an actual activity/action word or phrase explicitly stated in the input (e.g. "batch setting," "compression," "customer audit," "review of the media preparation record") — never from a document reference, SOP name, or specification/limit name that merely happens to appear nearby. Two specific failure patterns to avoid:
        * Do not fuse part of a limit/specification field's name into the activity phrase. E.g. if the input says "hardness parameter... unable to set in BMR Alert limit" and separately states the activity as "during batch setting," the activity is "batch setting" — do NOT write "During BMR compression in process," which fuses "BMR" (from "BMR Alert limit"/"BMR Limit," a specification field) into a fabricated activity phrase.
        * Do not substitute the Deviation To field's SOP/document name for the activity actually stated in the free text. E.g. if the source says "During the MedixCorp customer audit, the auditor identified..." and Deviation To is "IT Security SOP," the stated activity is "the MedixCorp customer audit" — do NOT write "During review of the IT Security SOP," which replaces the real stated activity with a document-reference field the source never described as an activity. (This also means the named organization, "MedixCorp," must survive — see the Customer/Organization Name Preservation Rule below; the activity context and that rule work together here, not separately.)
      * Preferred activity context formats include:
        * During review of ...
        * During analysis of ...
        * During testing of ...
        * During inspection of ...
        * During verification of ...
        * During reconciliation of ...
        * During qualification of ...
        * During execution of ...
        * During retrieval of ...
        * During manufacturing activity ...
        * During packing activity ...
        * During LIMS entry ...
        * Upon review of ...
        * While performing ...
      * Area/Location Code Conciseness Rule: If the source names a location as an area/room code followed by a department or sub-function name (e.g. "CVC-3 Secondary Packing", "CVC-3 Primary Packing"), use just the area/room code in the activity context (e.g. "CVC-3") and drop the trailing department/sub-function name — the code alone is sufficient to identify the location, and the department name is redundant detail. Only keep the fuller form if the source gives no standalone area/room code (e.g. the location is stated only as a department name with no code at all).

      KPI / Attribute / Condition Rules:

      * Clearly state the specific KPI, attribute, condition, record, result, parameter, equipment status, document field, or requirement involved in the deviation.
      * Use the most specific observable fact available from the input.
      * Avoid generic phrases such as: issue observed, discrepancy noted, problem identified, deviation found.
      * Prefer specific observations such as: batch number updated incorrectly, AR number entered incorrectly, audit trail entry deleted, yield observed below limit, product traces observed, qualification status missed, training not included in curriculum.
      * Grammatical Correctness Rule (final check, most important): Before returning the statement, re-read it end to end and confirm it is fully grammatically correct — every clause has a clear subject and verb that agree, tense is consistent throughout, articles and prepositions read naturally, and the sentence flows as prose a person would write, not a concatenation of fields. This is a polish pass on wording, NOT a license to change content: fix awkward phrasing by rewording it, never by dropping an identifier, value, or activity, and never by introducing an activity, equipment mention, or detail that is not explicitly stated in the input, even if that would make the sentence read more smoothly. Every identifier and value required by the rules above (SOP/document references, employee IDs, observed values, limits) MUST still be present after this check — if you cannot make the sentence grammatical while keeping all of them, keep the content and accept a slightly less elegant sentence rather than silently omitting or fabricating anything.

      Structure:

      <Activity context>, <observer/role if relevant> observed <KPI/attribute/condition> <observation statement>.

          Where:
          - For a single observation:
          <observation statement> = "as <observed value> against <requirement/limit>"

          - For multiple repeated measurements, trend data, or tabulated results of the SAME parameter:
          <observation statement> = "outside the <requirement/limit>"
          OR
          <observation statement> = "not meeting the <requirement/limit>"
          OR
          <observation statement> = "exceeding the <requirement/limit>"
          OR
          <observation statement> = "below the <requirement/limit>"

      <Activity context>, <observer/role if relevant> identified that <specific record, field, identifier, status, or condition> was <incorrectly entered, updated, recorded, assigned, deleted, omitted, or not performed>.

      - For two or more distinct, separately numbered/labeled observations:
      <Activity context 1>, <observer/role 1 if relevant> observed <KPI/attribute/condition 1> <observation statement 1>. Additionally, <activity context 2>, <observer/role 2 if relevant> observed <KPI/attribute/condition 2> <observation statement 2>.
      (repeat the "Additionally, ..." clause for each further distinct observation; never omit one)

      - For one finding involving multiple named individuals in different roles:
      <Activity context>, <role if relevant> observed <KPI/attribute/condition> <observation statement>, performed by <Role A>[, and reviewed by <Role C>].
      (include every role involved; never keep only the observer's role and drop the others; never substitute a name for a role)

      The final statement should be concise, factual, GMP-compliant, and typically written as a single sentence, or two clauses joined by "Additionally," when the input contains multiple distinct observations.

      Real-world examples (Trackwise input fields → Expected problem statement):

      Example 1:
      Title: Additional Two checklists Pulled and used for Analysis of Material Lot No:10000525081, without issuance.
