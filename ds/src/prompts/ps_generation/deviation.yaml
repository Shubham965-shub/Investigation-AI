      Example 20 (a duration/frequency requirement is explicitly given and must be preserved, but the only "observed" data are two raw calendar dates — do not leak the dates or calculate the day-gap yourself; also preserve the specific Annexure citation for the interval requirement, not just the parent SOP name, alongside the separate Annexure for the checklist finding; the equipment's ID (SGC/PLM/080) is dropped while its name (Planetary mixer) is kept, per the Instrument/Equipment ID Exclusion Rule):
      Title: Manual back-up of the manufacturing equipment was not performed as per the timeline defined in the SOP AL/IT/052
      Description: Observation 1: During manual backup review in leucine application for the equipment Planetary mixer (Equipment ID: SGC/PLM/080), it was identified that manual backup was not carried out as per the timeline defined in the SOP AL/IT/052. Manual backup taken in the month of June: 13/06/2025. Manual backup taken in the month of July: 25/07/2025. As per SOP AL/IT/052 manual backup of manufacturing equipment / QC instrument which are not connected to network shall be performed once in a month as per Annexure 15. The minimum difference between the previous backup to the current month backup should be 20 days and not more than 30 days. Observation 2: It was also identified that the manual backup review checklist, Checklist (Annexure 19) of SOP AL/IT/052, was not performed for the month of June and July 2025.
      Observed By: Roy, Abhijit
      → During manual backup review in leucine application for Planetary mixer, the individual observed that manual backup was not carried out within the required interval of 20 to 30 days defined in SOP AL/IT/052, Annexure 15. Additionally, the individual observed that the manual backup review checklist, Annexure 19 of SOP AL/IT/052, was not performed for the month of June and July 2025.

      Example 21 (two different analysts sharing the SAME role — one initiated the test, a different one later found the resulting issue; disambiguate by sequence, do not collapse into one "the analyst" reference just because only one of them technically "found" the problem, and do not drop the initiating analyst as mere incidental setup):
      Title: Sequence interrupted due to Instrument controller shut down during the test - Other Cinchona Alkaloids-Quinine Sulfate.
      Description: On 14/10/2025 analyst Ms. Treesa Johny (113206) initiated Other Cinchona Alkaloids by HPLC test by using 1070-HPLC-0032 instrument. On 15/10/2025 while monitoring the sequence analyst Mr. Avishek Das (113375) found that the sequence was interrupted at bin no 16 (Blank injection) due to 'user shutting down the controller while sequence was running'. Other Details: Product Name: Quinine Sulfate tablets [200mg] [FC] Test: Other Cinchona Alkaloids by HPLC Instrument Id: 1070-HPLC-0032
      Observed By: Mittapalli Reddy, Adinarayana
      → During Other Cinchona Alkaloids by HPLC testing of Quinine Sulfate tablets [200mg] [FC], initiated by one analyst, a second analyst found that the sequence was interrupted at bin no. 16 (Blank injection) due to the controller being shut down while the sequence was running.

      Example 19 (the SAME batch yield finding is stated both as a percentage against a percentage limit AND as an absolute weight in kg against a corresponding kg limit — use only the percentage, drop the kg restatement entirely; also a department-abbreviation role, "PDN person," and a bare equipment ID with no separate name, both handled by existing rules):
      Title: Batch yield found below the BMR specified limit after completion of compression process- Haloperidol TABLETS [1.5mg]
      Product Name / Material Name: Haloperidol tablets 1.5 mg
      Deviation To: BMR
      Description: On date 31/07/2026, at 23:45 hrs. during batch completion of product Haloperidol tablets 1.5 mg batch number 72066487, PDN person Mr. Yeshwanth observed that, yield at compression stage was 91.88 % against BMR specified limit of 93.00 to 100.00%. Details as below: Product: Haloperidol tablets 1.5 mg Product code: 2003609 Batch no: 72066487 Batch size: 10,00,000 Observed yield: 91.88% limit (93.0 to 100.0) Actual tablet in kg: 128.500 kg ( 130.209 to 140.010 ) Equipment ID: ODF-TAC-LVM-CMR-COM-267
      Observed By: Nirmal Roy.
      → During compression of Haloperidol tablets 1.5 mg, the PDN person observed batch yield at compression stage as 91.88% against the BMR specified limit of 93.00 to 100.00%.

