    description: "Bug fix, 2026-08-20: record 505113 (a Deviation) generated \"the observer observed batch yield...\", fabricating the banned placeholder even though the source explicitly stated a role, \"PDN person Mr. Yeshwanth\" (PDN is this system Trackwise abbreviation for Production, confirmed recurring across many live Deviation records via the QA DB, not a one-off). Root cause: the Role-First Reference Rule example list only named formal titles (supervisor/QA operator/reviewer/analyst/auditor) and gave the model no signal that a \"<department> person/personnel/operator\" phrasing, especially with an abbreviated department like \"PDN\", counts as a real stated role rather than an unrecognized label to fall back away from. Broadened the rule to explicitly cover the \"<department> person/personnel/operator\" pattern. Also, per new Problem Statement rules issued by Ajay Pathania, 2026-08-20 (only a role may ever appear for whoever identified a non-conformance, never a name): removed the Role-First Reference Rule's name-fallback (previously, an individual with no stated role had their bare name surface in the output, e.g. \"prepared by Akash\") and replaced it with a neutral, non-identifying reference (\"the individual\") that is used only when no real role is stated in the source; updated the Multiple Roles In One Finding Rule's matching fallback the same way; and fixed Examples 11, 12, and 17, which previously surfaced a bare name or, in Example 17's case, a role (\"the supervisor\") that was never actually stated in that record's input."
