      Do NOT generate evidence created later during investigation activities.

      Examples:

      - Investigation notes
      - Investigation summaries
      - Investigation reports
      - Root cause reports
      - CAPA records
      - Risk assessments
      - Deviation reports
      - Comparison reports
      - Side-by-side comparison sheets
      - Annotated worksheets
      - Meeting minutes
      - Discussion records
      - Email chains
      - Email notifications
      - Presentation slides
      - Investigator comments
      - Action plans
      - Review records

      These may support an investigation but do not capture the original event condition.

      EPHEMERAL COLLECTIBLE EVIDENCE RULE (CRITICAL)

      The objective is NOT to collect every record that could support the investigation.

      The objective is to identify evidence that captures the event condition exactly as it existed when observed and that could later disappear, be corrected, overwritten, consumed, cleaned, discarded, modified, or become unavailable.

      Prefer physical or digital evidence that investigators would immediately preserve to prevent loss of the original condition.

      Ask:

      "If the issue were corrected immediately after discovery, what evidence would investigators regret not having captured?"

      GENERATE ONLY THE MOST DIRECT COLLECTIBLES.

      Examples:

      Dilution Preparation Error

      GOOD:

      * Photograph of prepared dilution solution
      * Photograph of dilution glassware used
      * Retained prepared solution sample
      * Photograph of reagent containers used

      BAD:

      * Recalculation worksheet
      * Calculation comparison report
      * Investigation notes
      * Analytical summary

      LIMS Calculation Mismatch

      GOOD:

      * Screenshot of LIMS calculation result showing discrepancy

      POSSIBLY ACCEPTABLE:

      * Screenshot of active calculation configuration if it directly contains the observed error

      BAD:

      * STP calculation page
      * Calculation comparison sheet
      * Exported result record
      * Recreated calculations
      * Investigation summary

      Chromatographic Integration Error

      GOOD:

      * Chromatogram showing incorrect integration
      * Integration screen showing the observed issue

      BAD:

      * Comparison worksheet
      * Analyst explanation
      * Reprocessed results

      Physical Defect Event

      GOOD:

      * Retained defective unit
      * Photograph of defect as observed
      * Photograph of machine counter display showing units processed at time of detection

      BAD:

      * Defect trend report
      * Investigation conclusions
      * Machine logbook entry
      * In-process check record

      MINIMIZATION RULE

      Return the minimum number of evidence items necessary to capture the original event condition.

      If only one collectible evidence source directly captures the event, return only one item.

      Do not generate supporting evidence merely because it exists.

      Do not generate evidence quotas.

      Do not generate derivative, explanatory, comparison, recreated, reviewed, recalculated, or investigation-produced records unless they themselves were the observed event condition.

      RECORDS ARE NOT EVIDENCE

      Do NOT generate named records, logbook entries, or register entries as evidence items.

      A record is persistent documentation maintained in the quality system. Records will not
      disappear, be overwritten, or be lost after the event. They are not ephemeral.
      Collecting a record is an investigation retrieval action, not primary evidence capture.

      Bad:
      - Machine logbook
      - Operator logbook
      - In-process check record
      - Shift handover record
      - Line clearance record
      - Equipment cleaning record
      - Dispensing record
      - Environmental monitoring record
      - Sampling record
      - Inspection record
      - Quantity reconciliation record
      - Shipper count record
      - Issue log

      Convert records into evidence only when the physical display, counter, or printout at the
      exact time of the event is the collectible — not the record document.

      Examples:

      Bad:
      - Machine counter record

      Good:
      - Photograph of machine counter display at time of event detection

      Bad:
      - Quantity reconciliation record

      Good:
      - Photograph of quantity display at time of stoppage

      Bad:
      - In-process check sheet

      Good:
      - (exclude entirely — a completed check sheet is a record, not ephemeral evidence)


      DEPARTMENTAL DOCUMENTS TO EXCLUDE

      Manufacturing:
      - BMR
      - eBMR records
      - SOP copies
      - Training records
      - Validation reports
      - Calibration certificates
      - APQR documents
      - Change controls

      Quality Control:
      - STP
      - LIMS records
      - Audit trails
      - Final analytical worksheets
      - COA
      - Specifications
      - Method documents
      - Stability reports
      - Calibration reports

      Packaging:
      - BPR
      - Packaging specifications
      - Approved artworks
      - SOPs
      - Training records
      - Validation documents
      - Reconciliation reports

      Engineering:
      - Preventive maintenance records
      - Qualification documents
      - Calibration certificates
      - Utility validation reports
      - SOPs

      Quality Assurance:
      - Audit reports
      - Deviation history
      - Change controls
      - Compliance reports
      - SOPs

      Documentation:
      - Controlled document copies
      - Master copies
      - Revision history
      - Issuance logs
      - Archival records


      ACTIONS ARE NOT EVIDENCE

      Do NOT generate actions.

      Bad:
      - Review batch record
      - Check calibration status
      - Verify cleaning status
      - Inspect machine
      - Review audit trail
      - Check environmental conditions

      Convert actions into evidence when possible.

      Examples:

      Bad:
      - Check environmental conditions

      Good:
      - Photograph of environmental conditions in affected area

      Bad:
      - Verify container integrity

      Good:
      - Photograph of container condition and seal integrity

      Bad:
      - Inspect machine contact parts

      Good:
      - Photograph of machine contact parts

      DEDUPLICATION RULE (CRITICAL)

      Each evidence item must represent a UNIQUE INFORMATION SOURCE, not a different representation of the same data.

      DO NOT create multiple items for:
      - printed vs screenshot vs exported version of the same record
      - machine display vs system output of the same measurement
      - duplicate representations of the same measurement data

      If two items contain the same underlying information, merge them into ONE evidence item.

      FORMAT VARIATION IS NOT NEW EVIDENCE.

      Example:

      BAD (duplicate reasoning):
      - Screenshot of LIMS result
      - Printed LIMS result
      - Exported LIMS result file

      GOOD (merged):
      - LIMS result record showing ribbon thickness out-of-specification

      ---

      ONE-TO-ONE RULE:
      One physical or digital source = one evidence item.
      No reformatting-based expansion allowed.

      OUTPUT REQUIREMENTS

      - Return ONLY a valid JSON array.
      - Maximum 10 items.
      - Do NOT generate irrelevant items merely to reach the limit.
      - No duplicates.
      - Each item must be a concise noun-oriented evidence artifact.
      - Generic enough for reuse across incidents.
      - Specific enough to clearly identify the evidence.
      - Do not include batch numbers.
      - Do not include analyst names.
      - Do not include instrument IDs.
      - Do not include material codes.
      - Do not include document numbers.
      - Prefer evidence that directly captures the observed condition over supporting documentation.
      - Every evidence item should be plausibly photographable, printable, retainable, exportable, collectible, or attachable to an investigation report.

      CRITICAL: If there are only two evidence items, it is fine. They should be highly relevant and directly capture the event condition, rather than generating filler items to reach a higher count.

      Always return valid JSON, even if the array is empty. Do not return text outside the JSON array.
