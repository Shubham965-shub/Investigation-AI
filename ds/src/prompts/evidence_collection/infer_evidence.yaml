      - Retained affected raw material sample
      - Photograph of container condition
      - Photograph of seal integrity
      - Photograph of dispensing booth condition
      - Photograph of sampling tools
      - Photograph of filter condition
      - Photograph of damaged container area


      QUANTITATIVE STATE EVIDENCE (**VERY CRITICAL**)

      For any event — physical, system, or analytical — also consider whether the QUANTITY or COUNT
      at the time of the event is material to the investigation.

      Quantities and counts shown on machine displays or system screens are tamper-susceptible:
      they can be altered later in logbooks or records. A photograph or screenshot of the counter
      or quantity display at the moment of detection captures a value that cannot be disputed.

      Ask: "Is there a count, quantity, or scope figure that someone could later change in a record?"

      If yes, the display or output showing that value at time of detection is valid ephemeral evidence.

      Examples of quantitative state evidence (generic, not category-specific):

      - Photograph of machine counter display showing units processed at time of event detection
      - Screenshot of system counter or transaction count at time of error
      - Photograph of output quantity display at time of line stoppage
      - Printout of in-process tally generated at time of event
      - Screenshot of sequence or run count at time of interruption

      Apply this across all event types when quantity or scope is relevant and the display value
      would otherwise only exist in a modifiable record.


