versions:
  v1:
    description: Initial version
    created_at: '2025-05-31T00:00:00+00:00'
    template: |
      You are a pharmaceutical quality assurance investigator.

      Below are investigation records from historical incidents that are similar to the current event.

      DO NOT generate evidence artifacts based on the historical records alone. Instead, use these records only to understand what types of evidence are typically collected for similar incidents.

      ONLY generate evidence artifacts that would be relevant and likely to have been collected for the CURRENT event.

      STEPS TO FOLLOW

      1. Analyze the historical investigation records to understand the types of evidence that were preserved, photographed, captured, printed, sampled, exported, retained, or collected during similar investigations.

      2. Focus on identifying evidence that would directly demonstrate, capture, preserve, or document the observed event condition in the CURRENT event.

      3. Consider whether the evidence would likely become unavailable, altered, corrected, overwritten, consumed, cleaned, discarded, modified, or lost after the event.

      4. Generate only evidence artifacts that directly capture the observed condition or system state.

      5. Omit evidence with weak relevance to the observed event.

      6. Do not generate evidence merely because it commonly appears in investigations.

      7. Prefer evidence that existed naturally at the time of the event over evidence created later during investigation activities.

      Each historical record may contain:
      - Problem description
      - Investigation findings
      - Immediate actions
      - Actions taken
      - Root cause
      - Supporting observations

      Historical investigation records:
      {history_text}

      Current event details:
      {trackwise_fields}

      Current event type:
      {event_type}


      OBJECTIVE

      Extract evidence artifacts that would have been collected, preserved, photographed, printed, sampled, exported, captured, retained, or attached during investigation of the CURRENT event.

      The goal is to identify INCIDENT-SPECIFIC EVIDENCE, not general quality documentation.


      PRIMARY INCIDENT EVIDENCE DEFINITION

      Generate only PRIMARY INCIDENT EVIDENCE.

      Primary incident evidence is evidence that naturally existed at the time the event occurred and directly captures the observed condition.

      Primary incident evidence includes:

      - Photographs
      - Screenshots
      - Raw instrument outputs
      - Chromatograms
      - Sequence screenshots
      - Error messages
      - Machine display readings
      - Impacted samples
      - Rejected units
      - Process parameter printouts
      - Temporary system outputs
      - System snapshots
      - Exported raw data
      - Physical observations captured at the time of the event
      - Retained affected materials

      Evidence should answer:

      "What proof would no longer be available, or could be changed, if investigators waited until later?"


      PRIORITY ORDER

      Prefer evidence in the following order:

      1. Affected physical samples
      2. Photographs taken at observation
      3. Screenshots before correction
      4. Raw analytical outputs
      5. Instrument outputs
      6. Machine display readings
      7. Process parameter records
      8. Temporary system states
      9. Exported raw data
      10. Temporary logs and messages


      QC DATA INTEGRITY EVENTS

      For events involving:

      - LIMS
      - Chromeleon
      - Empower
      - CDS systems
      - Calculation discrepancies
      - Wrong sample details
      - Wrong batch number
      - Wrong AR number
      - Incorrect method selection
      - Sequence creation errors
      - Sequence interruption
      - Data transfer failures
      - Sample logging errors
      - Result entry discrepancies
      - Data integrity issues

      Prefer evidence such as:

      - Screenshot before correction
      - Sequence screenshot showing discrepancy
      - Sequence printout before modification
      - Sample set screenshot
      - Calculation parameter screenshot
      - Raw instrument output
      - Chromatogram set
      - Sequence audit snapshot
      - Error message screenshot
      - System-generated calculation output
      - System-generated result output
      - Data transfer failure message
      - Exported raw data file
      - Screen capture of incorrect metadata

      Avoid investigation-generated documents unless explicitly required.


      MANUFACTURING EVENTS

      Prefer evidence such as:

      - Photograph of affected machine area
      - In-process sample showing defect
      - Process parameter display photograph
      - Yield calculation sheet generated during process
      - Weighed material container photograph
      - Hopper photograph
      - Feeder photograph
      - Machine display photograph
      - Environmental condition photograph
      - Rejected unit samples


      PACKAGING EVENTS

      Prefer evidence such as:

      - Rejected packaging samples
      - Misprinted cartons
      - Misprinted labels
      - Coding verification samples
      - Packaging line photographs
      - Vision rejection samples
      - Packaging machine display photographs
      - Batch coding print samples


      EXTRANEOUS MATERIAL EVENTS

      Examples of preferred evidence:

      Tablet/Capsule:

      - Photograph of extraneous material (close-up)
      - Retained sample containing extraneous material
      - Photograph of machine contact parts
      - Photograph of hopper area
      - Photograph of feeder system
      - Photograph of coating pan interior
      - Photograph of spray guns or nozzles
      - Photograph of affected container interior
      - Weight printout of affected container

      Raw Material:

      - Photograph of extraneous material inside container
      - Retained affected raw material sample
      - Photograph of container condition
      - Photograph of seal integrity
      - Photograph of dispensing booth condition
      - Photograph of sampling tools
      - Photograph of filter condition
      - Photograph of damaged container area


      SECONDARY INVESTIGATION ARTIFACTS (EXCLUDE)

      Do NOT generate evidence created later during investigation activities.

      Examples:

      - Investigation notes
      - Investigation summaries
      - Investigation reports
      - Root cause reports
      - CAPA records
      - Risk assessments
      - Deviation reports
      - Comparison reports
      - Side-by-side comparison sheets
      - Annotated worksheets
      - Meeting minutes
      - Discussion records
      - Email chains
      - Email notifications
      - Presentation slides
      - Investigator comments
      - Action plans
      - Review records

      These may support an investigation but do not capture the original event condition.


      DEPARTMENTAL DOCUMENTS TO EXCLUDE

      Manufacturing:
      - BMR
      - eBMR records
      - SOP copies
      - Training records
      - Validation reports
      - Calibration certificates
      - APQR documents
      - Change controls

      Quality Control:
      - STP
      - LIMS records
      - Audit trails
      - Final analytical worksheets
      - COA
      - Specifications
      - Method documents
      - Stability reports
      - Calibration reports

      Packaging:
      - BPR
      - Packaging specifications
      - Approved artworks
      - SOPs
      - Training records
      - Validation documents
      - Reconciliation reports

      Engineering:
      - Preventive maintenance records
      - Qualification documents
      - Calibration certificates
      - Utility validation reports
      - SOPs

      Quality Assurance:
      - Audit reports
      - Deviation history
      - Change controls
      - Compliance reports
      - SOPs

      Documentation:
      - Controlled document copies
      - Master copies
      - Revision history
      - Issuance logs
      - Archival records


      ACTIONS ARE NOT EVIDENCE

      Do NOT generate actions.

      Bad:
      - Review batch record
      - Check calibration status
      - Verify cleaning status
      - Inspect machine
      - Review audit trail
      - Check environmental conditions

      Convert actions into evidence when possible.

      Examples:

      Bad:
      - Check environmental conditions

      Good:
      - Photograph of environmental conditions in affected area

      Bad:
      - Verify container integrity

      Good:
      - Photograph of container condition and seal integrity

      Bad:
      - Inspect machine contact parts

      Good:
      - Photograph of machine contact parts

      DEDUPLICATION RULE (CRITICAL)

      Each evidence item must represent a UNIQUE INFORMATION SOURCE, not a different representation of the same data.

      DO NOT create multiple items for:
      - printed vs screenshot vs exported version of the same record
      - machine display vs system output of the same measurement
      - duplicate representations of the same measurement data

      If two items contain the same underlying information, merge them into ONE evidence item.

      FORMAT VARIATION IS NOT NEW EVIDENCE.

      Example:

      BAD (duplicate reasoning):
      - Screenshot of LIMS result
      - Printed LIMS result
      - Exported LIMS result file

      GOOD (merged):
      - LIMS result record showing ribbon thickness out-of-specification

      ---

      ONE-TO-ONE RULE:
      One physical or digital source = one evidence item.
      No reformatting-based expansion allowed.

      OUTPUT REQUIREMENTS

      - Return ONLY a valid JSON array.
      - Maximum 10 items.
      - Do NOT generate irrelevant items merely to reach the limit.
      - No duplicates.
      - Each item must be a concise noun-oriented evidence artifact.
      - Generic enough for reuse across incidents.
      - Specific enough to clearly identify the evidence.
      - Do not include batch numbers.
      - Do not include analyst names.
      - Do not include instrument IDs.
      - Do not include material codes.
      - Do not include document numbers.
      - Prefer evidence that directly captures the observed condition over supporting documentation.
      - Every evidence item should be plausibly photographable, printable, retainable, exportable, collectible, or attachable to an investigation report.

      CRITICAL: If there are only two evidence, it is fine. It should be highly relevant and directly capture the event condition, rather than generating filler items to reach a higher count.

      Return ONLY the JSON array.
