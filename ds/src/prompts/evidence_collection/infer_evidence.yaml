    template: |
      You are a pharmaceutical Quality Assurance investigator. 

      Analyze the provided historical investigation records to understand typical evidence collection, then generate a JSON array of PRIMARY INCIDENT EVIDENCE artifacts specifically for the CURRENT event.
      The evidence should be very concise and no ambiguous.

      **ALWAYS CAPTURE COUNT OR QUANTITY VALUES NOT JUST DISPLAYS AS SEPARATE EVIDENCE ITEMS WHEN THEY ARE MATERIAL TO THE EVENT.**

      CRITICAL RULES FOR EVIDENCE:

      1. THE EPHEMERAL RULE (Primary Logic): 
      Only generate evidence that captures the exact physical or digital condition at the moment of the event. 
      - Self-Pondering Question: "If the issue was corrected immediately after discovery, what specific proof would disappear, be cleaned, overwritten, or changed if we didn't capture it right then?"
      - Allowed: Photographs, screenshots before correction, retained physical samples, raw temporary system outputs, error messages.

      2. QUANTITATIVE STATE: 
      If a count, quantity, or scope is material to the investigation, capture the tamper-susceptible display at that exact moment.
      - Example: "Photograph of machine counter display" (NOT a later logbook entry).

      3. COMPARATIVE VISUAL EVIDENCE (EXPECTED VS. OBSERVED):
      Whenever the event involves a physical discrepancy, defect, or mismatch (e.g., illegible printing, wrong color, incorrect label, damaged component), capture the defective condition alongside the approved standard to establish the deviation.
      - BAD: "Photograph of the illegible printing." (Too isolated)
      - GOOD: "Photograph of the defective unit alongside the approved physical reference"

      4. NO PERSISTENT RECORDS (Strict Exclusion): 
      Records are not ephemeral evidence; they are retrieval actions. 
      - DO NOT generate: BMR/BPRs, logbooks, completed check sheets, audit reports, CAPAs, investigation summaries, or standard QC/Manufacturing documents. 

      5. NO ACTIONS: 
      Evidence must be a collectible artifact (noun), not an investigative step (verb).
      - BAD: "Check environmental conditions."
      - GOOD: "Photograph of environmental conditions"

      6. ABSTRACTION (NO EVENT-SPECIFIC VALUES):
      Descriptions must be generic enough to serve as a reusable template. Do NOT include specific values, measurements, percentages, or exact quantities from the current event. 
      - BAD: "Photograph of the auto-inspection yield display showing 86.14% yield."
      - GOOD: "Photograph of the auto-inspection yield display showing the observed yield."
      - Exclude: Exact numbers, batch numbers, analyst names, instrument IDs, material codes, and document numbers.

      7. MINIMIZATION & DEDUPLICATION: 
      - Merge duplicate formats (e.g., do not list a screenshot and a printout of the same LIMS result).
      - Return only the minimum items necessary to capture the original condition. If only two items exist, return only two.

      8. CONCISENESS & CLARITY: 
      Each evidence item must be a concise noun-oriented artifact that clearly identifies the evidence without ambiguity.
      **ONLY few words that is a coherent evidence. NOT complete sentences.**
      - BAD: "Photograph of the affected printed cartons showing the oil stain and color variation on the Strides logo alongside an approved carton reference to demonstrate the visual discrepancy Photograph of the affected printed cartons This much is enough"
      - GOOD: "Photograph of the affected printed carton"

      INPUT DATA:
      Historical investigation records: {history_text}
      Current event details: {trackwise_fields}
      Current event type: {event_type}

      OUTPUT FORMAT:
      Return ONLY a valid JSON array of strings (maximum 10 items). Do not output any text, markdown, or explanations outside the JSON array. Return an empty array [] if no ephemeral evidence applies.
