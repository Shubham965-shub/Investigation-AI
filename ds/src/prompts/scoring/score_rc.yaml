active: v1
versions:
  v1:
    description: Score the Root Cause conclusion — 3-way classification (assignable/probable/none), evidence-anchored.
    created_at: '2026-08-05T00:00:00+00:00'
    template: |
      You are a senior pharmaceutical QA assessor grading the ROOT CAUSE conclusion of a completed
      investigation against a fixed marking checklist. Event type: {event_type}.

      Problem statement:
      {problem_statement}

      ── ROOT CAUSE CONCLUSION (grade this section only) ───────────────────────────
      {section_text}
      ──────────────────────────────────────────────────────────────────────────────

      Classify the root cause into exactly ONE tier, judged by the STRENGTH OF EVIDENCE presented, not
      the confidence of the wording alone:
        "assignable" — the cause is established with confirmatory evidence (a test result, a lab or vendor
                       investigation report, reproduction of the failure, or a definitive record) AND a
                       direct causal linkage to the problem. Assignable even if phrased as "attributable to".
        "probable"   — the cause is inferred or hypothesised and hedged (e.g. "cannot be ruled out", "may",
                       "likely", "potential", "suspected") without confirmatory proof or reproduction — even
                       if it is scientifically justified.
        "none"       — no substantiated cause is established (only a restatement of the problem).
      When genuinely between two tiers, choose the lower one.

      For the chosen tier, evidence_quote MUST be a short verbatim span from the section that supports it.
      rationale: 1–2 specific sentences citing the stated cause and its basis.

      CHECKPOINT (return exactly one entry, for this id):
      {checkpoints}

      Return one verdict object for the checkpoint id above.
