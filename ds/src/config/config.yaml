# Schema and structural configuration
# Version-controlled with the codebase. Customize to match your database schema.

tables:
  # NOTE (2026-07-30): the real table is t_deviations_vector_test — plain
  # t_deviations_vector doesn't exist. This silently broke every low-
  # confidence historical-search fallback (evidence_collection today, rci_plan
  # as of this change) since the search query's exception is swallowed and
  # just returns zero candidates. Confirmed via information_schema.
  #
  # t_deviations_vector_test only has 6 columns (deviation_id, rci_id,
  # description, root_cause_summary, description_vector,
  # root_cause_summary_vector) — no qe_type, location, date_opened, etc.
  # search_details holds the full event metadata and is joined against
  # `search` on (deviation_id, rci_id) to fetch those details.
  search: t_deviations_vector_test
  search_details: investigation_ai_sample_test
  join_secondary_key: rci_id
  summary: t_deviations_summary
  summary_id_column: deviation_id
  summary_columns:
    event_description: title
    rc_summary_summary: root_cause_summary_summary
    capa: capa_details_summary
    capa_date: capa_date

columns:
  id: deviation_id
  description: description
  root_cause: root_cause_summary
  category: root_cause_category
  date_opened: date_opened
  qe_type: qe_type
  location: location
  instrument: instrument_equipment
  material: name_of_material
  description_tsv: description
  root_cause_tsv: root_cause_summary
  description_vector: description_vector
  root_cause_vector: root_cause_summary_vector
  sfg_code: sfg_code
  capa_number: capa_number
  # No gen_* action columns exist on investigation_ai_sample_test (confirmed
  # via information_schema, 2026-08-05) — left blank so settings.COLUMN_*
  # resolve to "" instead of a nonexistent column name. A real `immediate_actions`
  # column does exist there, but it isn't currently selected by the details-table
  # join in capa_synthesizer_route.py, so mapping it here alone wouldn't
  # populate anything yet.
  immediate_actions: ""
  corrective_actions: ""
  preventive_actions: ""
  capa_implementation_date: capa_implementation_date


# Columns to exclude from search results (e.g. vector columns)
exclude_columns:
  - description_vector
  - root_cause_summary_vector

search:
  keyword_limit: 50000
  semantic_limit: 150
  # rerank_top_k: 20
  final_top_k: 10
  relevance_treshold: 0.5

openai:
  model: gpt-5.4-mini
  embedding_model: text-embedding-3-large
  embedding_dimensions: 3072

llm:
  temperature: 0.0
