server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real static file resolves to
    # index.html so react-router-dom's client-side routes work on refresh/
    # direct navigation (nginx would otherwise 404 on e.g. /investigations/123).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
