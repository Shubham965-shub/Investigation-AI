name: Application Coverage Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Smoke Tests
        working-directory: qa
        run: mvn clean test -Psmoke
        env:
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}

  sanity-tests:
    name: Sanity Tests
    needs: smoke-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Sanity Tests
        working-directory: qa
        run: mvn clean test -Psanity
        env:
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}

  frontend-coverage:
    name: Frontend Coverage Check
    needs: sanity-tests
    runs-on: ubuntu-latest

    defaults:
  run:
    working-directory: frontend

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: "22"
      cache: npm
      cache-dependency-path: frontend/package-lock.json
      registry-url: https://npm.pkg.github.com

  - name: Install Dependencies
    run: npm ci
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  - name: Run Frontend Tests with Coverage
    run: npm run test:coverage
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  - name: Check Frontend Coverage
    run: |
      if [ ! -f coverage/coverage-summary.json ]; then
        echo "ERROR: coverage/coverage-summary.json was not generated."
        exit 1
      fi

      COVERAGE=$(node -e "
        const fs = require('fs');

        const data = JSON.parse(
          fs.readFileSync('coverage/coverage-summary.json', 'utf8')
        );

        console.log(data.total.lines.pct);
      ")

      echo "======================================"
      echo "Frontend Line Coverage: ${COVERAGE}%"
      echo "Required Coverage: 80%"
      echo "======================================"

      if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
        echo "Frontend coverage is 80% or higher. PASS"
      else
        echo "Frontend coverage is below 80%. FAIL"
        exit 1
      fi

  - name: Upload Frontend Coverage Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: frontend-coverage-report
      path: frontend/coverage/


  backend-coverage:
    name: Backend Coverage Check
    needs: frontend-coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Backend Dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run Backend Tests with Coverage
      working-directory: backend
      run: |
        python -m pytest unittests \
          --cov=backend \
          --cov-report=term-missing \
          --cov-report=html \
          --cov-report=json

    - name: Check Backend Coverage
      working-directory: backend
      run: |
        COVERAGE=$(python -c "
        import json

        with open('coverage.json') as f:
            data = json.load(f)

        print(data['totals']['percent_covered'])
        ")

        echo "======================================"
        echo "Backend Line Coverage: ${COVERAGE}%"
        echo "Required Coverage: 80%"
        echo "======================================"

        python - "$COVERAGE" <<'PY'
        import sys

        coverage = float(sys.argv[1])

        if coverage >= 80:
            print("Backend coverage is 80% or higher. PASS")
        else:
            print("Backend coverage is below 80%. FAIL")
            sys.exit(1)
        PY

    - name: Upload Backend Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: backend/htmlcov/
