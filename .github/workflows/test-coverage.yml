name: Application Coverage Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  sanity-tests:
    name: Sanity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: qa/pom.xml

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Verify QA Maven Project
        run: test -f qa/pom.xml

      - name: Run Sanity Tests
        run: |
          mvn -f qa/pom.xml clean test \
            -Dgroups=sanity \
            -Dheadless=true

      - name: Upload TestNG Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-reports
          path: |
            qa/target/surefire-reports/
            qa/target/test-results/
          if-no-files-found: warn

  frontend-coverage:
    name: Frontend Coverage Check
    needs: sanity-tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests with Coverage
        run: npm run test:coverage

      - name: Check Frontend Coverage
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "ERROR: coverage/coverage-summary.json was not generated."
            exit 1
          fi

          COVERAGE=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(
              fs.readFileSync('coverage/coverage-summary.json', 'utf8')
            );
            console.log(data.total.lines.pct);
          ")

          echo "======================================"
          echo "Frontend Line Coverage: ${COVERAGE}%"
          echo "Required Coverage: 80%"
          echo "======================================"

          node -e "
            const coverage = Number('${COVERAGE}');

            if (!Number.isFinite(coverage)) {
              console.error('ERROR: Invalid frontend coverage value.');
              process.exit(1);
            }

            if (coverage >= 80) {
              console.log('Frontend coverage is 80% or higher. PASS');
            } else {
              console.error('Frontend coverage is below 80%. FAIL');
              process.exit(1);
            }
          "

      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: warn

  backend-coverage:
    name: Backend Coverage Check
    needs: frontend-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run Backend Tests with Coverage
        working-directory: backend
        run: |
          python -m pytest unittests \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=json

      - name: Check Backend Coverage
        working-directory: backend
        run: |
          if [ ! -f coverage.json ]; then
            echo "ERROR: coverage.json was not generated."
            exit 1
          fi

          COVERAGE=$(python -c "
          import json

          with open('coverage.json', 'r') as f:
              data = json.load(f)

          print(data['totals']['percent_covered'])
          ")

          echo "======================================"
          echo "Backend Line Coverage: ${COVERAGE}%"
          echo "Required Coverage: 80%"
          echo "======================================"

          python - "$COVERAGE" <<'PY'
          import sys

          coverage = float(sys.argv[1])

          if coverage >= 80:
              print("Backend coverage is 80% or higher. PASS")
          else:
              print("Backend coverage is below 80%. FAIL")
              sys.exit(1)
          PY

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
          if-no-files-found: warn
