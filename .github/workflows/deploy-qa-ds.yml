# CD: ds → Azure Container App investigationai-search-agent (QA, internal-only).
#
# Same auth model as deploy-qa-backend.yml: ACR admin creds for image
# build+push, service principal (AZURE_CREDENTIALS) for the container-app update.
name: Deploy DS to QA

on:
  push:
    branches: [main]
    paths:
      - "ds/**"
      - ".github/workflows/deploy-qa-ds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qa-ds
  cancel-in-progress: false

env:
  IMAGE: investigationaiacr.azurecr.io/investigationai-search-agent:${{ github.sha }}
  RG: QA-Lighthouse
  APP: investigationai-search-agent

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: investigationaiacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t "$IMAGE" ds
          docker push "$IMAGE"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update container app
        run: az containerapp update -n "$APP" -g "$RG" --image "$IMAGE"
