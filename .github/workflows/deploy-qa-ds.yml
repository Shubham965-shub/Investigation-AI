# CD: ds → Azure Container Apps (internal-only ingress). Branch picks the stack:
#   main  → investigationai-search-agent (UAT)
#   stage → investigationai-ds-stage     (dev-test; ACA names cap at 32 chars)
#
# Same auth model as the backend workflow: ACR admin creds for image
# build+push, service principal (AZURE_CREDENTIALS) for the container-app update.
name: Deploy DS (main→UAT, stage→dev)

on:
  push:
    branches: [main, stage]
    paths:
      - "ds/**"
      - ".github/workflows/deploy-qa-ds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ds-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: investigationaiacr.azurecr.io/investigationai-search-agent:${{ github.sha }}
  RG: QA-Lighthouse
  APP: ${{ github.ref_name == 'main' && 'investigationai-search-agent' || 'investigationai-ds-stage' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: investigationaiacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t "$IMAGE" ds
          docker push "$IMAGE"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update container app
        run: az containerapp update -n "$APP" -g "$RG" --image "$IMAGE"
