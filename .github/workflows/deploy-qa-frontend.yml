# CD: frontend → Azure Static Web App investigationai-fe-qa-v2 (QA).
#
# frontend/.env is NOT in git, so every build-time value must be provided
# here (Vite env vars are baked in at build time). npm ci needs
# NODE_AUTH_TOKEN (secret) to install private @strides-pharma-science-ltd
# packages from GitHub Packages. Deploys the prebuilt dist/ with the SWA
# deployment token.
name: Deploy frontend to QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-qa-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-qa-frontend
  cancel-in-progress: false

env:
  VITE_API_BASE_URL: https://investigationai-be-qa.redtree-0b17d746.centralindia.azurecontainerapps.io/api
  VITE_FEEDBACK_API_BASE_URL: https://feedback-service.graysand-fe5571c1.centralindia.azurecontainerapps.io/api/v1
  # PostHog project tokens are client-side by design — they ship in the bundle.
  VITE_POSTHOG_PROJECT_TOKEN: phc_nSFXA6dYnM6N2sRHTJxqPHuhf8yzwa7bkQsBvfAiYuMV
  VITE_POSTHOG_HOST: https://posthog.strideslighthouse.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@strides-pharma-science-ltd"

      - name: Build
        working-directory: frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          npm ci
          npm run build

      - name: Assert QA API URL baked into bundle
        run: |
          grep -rql "investigationai-be-qa" frontend/dist/assets
          ! grep -rq "localhost:8000" frontend/dist/assets

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          output_location: ""
